# A data service (database, queue, storage, internal service) never joins
# `proxy`: `app` and `data` are internal (no Internet, no route to the host),
# and a container only reaches the services of the networks it shares with them.
networks:
  # Traefik and the services it routes from the front; Internet and the host
  # (extra_hosts -> PS_GATEWAY_IP) for them.
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${PS_SUBNET}
          gateway: ${PS_GATEWAY_IP}
  # nginx <-> php-fpm (FastCGI)
  app:
    driver: bridge
    internal: true
  # Databases, queues, storage and internal services.
  data:
    driver: bridge
    internal: true
  # Internet and the host for the containers that are not on `proxy`.
  egress:
    driver: bridge
  docker-socket:
    driver: bridge
    internal: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE}
    max-file: "${DOCKER_LOG_MAX_FILE}"

services:
  traefik:
    logging: *default-logging
    image: ${TRAEFIK_IMAGE}
    networks:
      proxy:
        ipv4_address: ${PS_TRAEFIK_IP}
      # Routes the services that are not on `proxy` (label traefik.docker.network).
      data: {}
      docker-socket: {}
    depends_on:
      - docker-socket-proxy
    ports:
      - ${TRAEFIK_HTTPS_PORT}:443
      - ${TRAEFIK_HTTP_PORT}:80
    volumes:
      - ./infra/traefik/dynamic_conf.yaml:/etc/traefik/dynamic_conf.yaml:ro
      - ./infra/traefik/letsencrypt:/etc/traefik/letsencrypt
      - ./infra/certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.traefik-console.rule=Host(`traefik-console.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.traefik-console.service=api@internal"
      - "traefik.http.middlewares.admin-secured.basicauth.realm=Secured"
      - "traefik.http.middlewares.admin-secured.basicauth.users=${ADMIN_BASIC_AUTH_USER}"
      - "traefik.http.middlewares.admin-allowlist.ipallowlist.sourcerange=${ADMIN_ALLOWED_SOURCE_RANGES}"
      - "traefik.http.middlewares.admin-console.chain.middlewares=admin-allowlist@docker,admin-secured@docker"
      - "traefik.http.middlewares.traefik-console-root.redirectregex.regex=^https?://([^/]+)/?$$"
      - "traefik.http.middlewares.traefik-console-root.redirectregex.replacement=https://$${1}/dashboard/"
      - "traefik.http.routers.traefik-console.middlewares=traefik-console-root@docker,admin-console@docker"
    environment:
      - TRAEFIK_API=true
      - TRAEFIK_API_INSECURE=false
      - TRAEFIK_ACCESSLOG=${TRAEFIK_ACCESSLOG}
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL}
      - TRAEFIK_LOG_FORMAT=common
      - TRAEFIK_PROVIDERS_DOCKER=true
      - TRAEFIK_PROVIDERS_DOCKER_ENDPOINT=tcp://docker-socket-proxy:2375
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=${COMPOSE_PROJECT_NAME}_proxy
      - TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT=false
      - TRAEFIK_PROVIDERS_DOCKER_CONSTRAINTS=Label(`traefik.project_name`,`${COMPOSE_PROJECT_NAME}`)
      - TRAEFIK_ENTRYPOINTS_WEB=true
      - TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO=websecure
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME=https
      - TRAEFIK_ENTRYPOINTS_WEBSECURE=true
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS=true
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER=letsencrypt
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_MAIN=${PHRASEA_DOMAIN}
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_DOMAINS_0_SANS=*.${PHRASEA_DOMAIN}
      - TRAEFIK_PROVIDERS_FILE_FILENAME
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT=${LETS_ENCRYPT_ENABLED}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${LETS_ENCRYPT_CONTACT_EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_PROVIDER=${LETS_ENCRYPT_PROVIDER}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_CASERVER=${LETS_ENCRYPT_CA_SERVER}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_DNSCHALLENGE_DELAYBEFORECHECK=10
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE=/etc/traefik/letsencrypt/acme.json
      - GANDIV5_API_KEY=${LEGO_GANDIV5_API_KEY}
      - OVH_ENDPOINT=${LEGO_OVH_ENDPOINT}
      - OVH_APPLICATION_KEY=${LEGO_OVH_APPLICATION_KEY}
      - OVH_APPLICATION_SECRET=${LEGO_OVH_APPLICATION_SECRET}
      - OVH_CONSUMER_KEY=${LEGO_OVH_CONSUMER_KEY}
      - AWS_ACCESS_KEY_ID=${LEGO_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${LEGO_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${LEGO_AWS_REGION}
      - AWS_HOSTED_ZONE_ID=${LEGO_AWS_HOSTED_ZONE_ID}
      - AWS_ASSUME_ROLE_ARN=${LEGO_AWS_ASSUME_ROLE_ARN}
      - AWS_PROFILE=${LEGO_AWS_PROFILE}
      - AWS_SDK_LOAD_CONFIG=${LEGO_AWS_SDK_LOAD_CONFIG}
      - SCW_PROJECT_ID=${LEGO_SCW_PROJECT_ID}
      - SCW_SECRET_KEY=${LEGO_SCW_SECRET_KEY}
      - SCW_ACCESS_KEY=${LEGO_SCW_ACCESS_KEY}

  docker-socket-proxy:
    logging: *default-logging
    image: ${DOCKER_SOCKET_PROXY_IMAGE}
    networks:
      - docker-socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp

  a_client:
    logging: *default-logging
    profiles:
      - none
    build:
      args:
        BASE_TAG: ${DOCKER_TAG}
        REGISTRY_NAMESPACE: ${REGISTRY_NAMESPACE}
        SENTRY_RELEASE: ${SENTRY_RELEASE}
      network: host
      entitlements:
        - network.host
    networks:
      - proxy
    environment:
      - DEV_MODE
      - DEBUG_STACK_CONFIG
      - KEYCLOAK_URL
      - KEYCLOAK_REALM_NAME
      - DISPLAY_SERVICES_MENU
      - DASHBOARD_CLIENT_URL
      - AUTO_CONNECT_IDP
      - MATOMO_URL
      - MATOMO_SITE_ID
      - MATOMO_MEDIA_PLUGIN_ENABLED
      - SENTRY_DSN=${CLIENT_SENTRY_DSN}
      - SENTRY_ENVIRONMENT
      - SENTRY_TUNNEL_RATE_LIMIT_PER_IP
      - SENTRY_TUNNEL_RATE_LIMIT_GLOBAL
      - CSP_REPORT_ONLY
      - CSP_EXTRA_SOURCES
      - VERIFY_SSL
      - VERIFY_HOST
      - CONFIGURATOR_S3_ENDPOINT=${S3_ENDPOINT}
      # Read-only on the configurator bucket when set (minio-setup)
      - CONFIGURATOR_S3_ACCESS_KEY=${CONFIG_READER_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - CONFIGURATOR_S3_SECRET_KEY=${CONFIG_READER_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - CONFIGURATOR_S3_PATH_PREFIX=${S3_PATH_PREFIX}
      - CONFIGURATOR_S3_REGION=${S3_REGION}
      - CONFIGURATOR_S3_BUCKET_NAME
      - CONFIGURATOR_S3_USE_PATH_STYLE_ENDPOINT=${S3_USE_PATH_STYLE_ENDPOINT}
      - S3_MAX_OBJECT_SIZE
      - NOTIFICATIONS_ENABLED
      - SOCKUDO_KEY
      # Carries the public HTTPS port, which is not 443 on every stack (CI).
      - SOCKUDO_HOST=ws.${PHRASEA_DOMAIN}${HTTPS_PORT_PREFIX}
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
    extra_hosts:
      - ws.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - minio.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  a_api-php:
    logging: *default-logging
    profiles:
      - none
    build:
      target: api-php
      args:
        BASE_TAG: ${DOCKER_TAG}
        REGISTRY_NAMESPACE: ${REGISTRY_NAMESPACE}
        SENTRY_RELEASE: ${SENTRY_RELEASE}
        PHRASEA_VERSION: ${PHRASEA_VERSION}
        PHRASEA_COMMIT: ${PHRASEA_COMMIT}
      network: host
      entitlements:
        - network.host
    networks:
      - app
      - data
      - egress
    environment:
      - APP_ENV
      - LOG_ACTION_LEVEL
      - WORKER_VERBOSITY
      - DEBUG_STACK_CONFIG
      - FIXTURES_GENERATE_IMAGES
      - DEV_MESSENGER_TRANSPORT_DSN
      - TRUSTED_PROXIES
      - VERIFY_SSL
      - VERIFY_HOST
      - MAILER_DSN
      - MAIL_FROM
      - MAIL_FROM_DISPLAY_NAME
      - POSTGRES_HOST
      - RABBITMQ_HOST
      - RABBITMQ_PORT
      - RABBITMQ_USER
      - RABBITMQ_PASSWORD
      - RABBITMQ_SSL
      - REPORT_API_URL
      - DISPLAY_SERVICES_MENU
      - DASHBOARD_CLIENT_URL
      - NEWRELIC_ENABLED
      - NEWRELIC_LICENSE_KEY
      - SENTRY_DSN=${PHP_SENTRY_DSN}
      - SENTRY_ENVIRONMENT
      - KEYCLOAK_URL
      - KEYCLOAK_INTERNAL_URL
      - KEYCLOAK_REALM_NAME
      - CONFIGURATOR_DB_NAME
      - CONFIGURATOR_S3_ENDPOINT=${S3_ENDPOINT}
      - CONFIGURATOR_S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - CONFIGURATOR_S3_SECRET_KEY=${S3_SECRET_KEY}
      - CONFIGURATOR_S3_PATH_PREFIX=${S3_PATH_PREFIX}
      - CONFIGURATOR_S3_REGION=${S3_REGION}
      - CONFIGURATOR_S3_BUCKET_NAME
      - CONFIGURATOR_S3_USE_PATH_STYLE_ENDPOINT=${S3_USE_PATH_STYLE_ENDPOINT}
      - NOTIFICATIONS_ENABLED
      - MATOMO_URL
      - MATOMO_SITE_ID
      - MATOMO_MEDIA_PLUGIN_ENABLED
      - MATOMO_AUTH_TOKEN
      - SOCKUDO_HOST=ws.${PHRASEA_DOMAIN}
      - SOCKUDO_APP_ID
      - SOCKUDO_KEY
      - SOCKUDO_SECRET
    extra_hosts:
      - keycloak.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - minio.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - ws.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  a_s3-php:
    logging: *default-logging
    extends:
      service: a_api-php
    profiles:
      - none
    environment:
      - S3_ENDPOINT
      - S3_PATH_PREFIX
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_REGION
      - S3_USE_PATH_STYLE_ENDPOINT
      - S3_MULTIPART_MIN_CHUNK_SIZE
      - S3_MULTIPART_MAX_CHUNK_SIZE
      - S3_MULTIPART_MAX_PART_NUMBER
      - S3_MAX_OBJECT_SIZE
      - MULTIPART_UPLOAD_RATE_LIMIT
      - MULTIPART_UPLOAD_MAX_PENDING
      - PREFERRED_FILE_TYPES

  uploader-api-php:
    logging: *default-logging
    extends:
      service: a_s3-php
    profiles:
      - uploader
    image: ${REGISTRY_NAMESPACE}uploader-api-php:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./uploader/api/Dockerfile
    environment:
      - ASSET_CONSUMER_COMMIT_URI
      - ASSET_CONSUMER_ACCESS_TOKEN
      - RABBITMQ_VHOST=${UPLOADER_RABBITMQ_VHOST}
      - UPLOADER_API_URL
      - UPLOADER_CLIENT_URL
      - DATABOX_API_URL
      - ADMIN_CLIENT_ID=${UPLOADER_ADMIN_CLIENT_ID}
      - ADMIN_CLIENT_SECRET=${UPLOADER_ADMIN_CLIENT_SECRET}
      - APP_SECRET=${UPLOADER_APP_SECRET}
      - UPLOAD_MAX_FILE_SIZE
      - S3_REQUEST_SIGNATURE_TTL=${UPLOADER_REQUEST_SIGNATURE_TTL}
      - S3_BUCKET_NAME=${UPLOADER_S3_BUCKET_NAME}
      # The MinIO user of the application when set (minio-setup): its bucket,
      # and config.json in the configurator bucket, pushed from the admin
      - S3_ACCESS_KEY=${UPLOADER_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - S3_SECRET_KEY=${UPLOADER_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - CONFIGURATOR_S3_ACCESS_KEY=${UPLOADER_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - CONFIGURATOR_S3_SECRET_KEY=${UPLOADER_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - DELETE_ASSET_GRACEFUL_TIME=${UPLOADER_DELETE_ASSET_GRACEFUL_TIME}
      - UPLOAD_LINK_MAX_TTL=${UPLOADER_UPLOAD_LINK_MAX_TTL}
      - DOWNLOAD_RATE_LIMIT=${UPLOADER_DOWNLOAD_RATE_LIMIT}
      # The Phraseanet of the stack (PHRASEANET_DOMAIN, routed to the gateway) unless set
      - TARGET_PRIVATE_ORIGINS=${UPLOADER_TARGET_PRIVATE_ORIGINS:-${PHRASEANET_URL}}
      - NEWRELIC_APP_NAME=uploader-api
      - ALLOWED_FILE_TYPES=${UPLOADER_ALLOWED_FILE_TYPES}
      - DB_NAME=${UPLOADER_DB_NAME}
      - POSTGRES_USER=${UPLOADER_POSTGRES_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${UPLOADER_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - uploader:/var/data/upload
    extra_hosts:
      - ${PHRASEANET_DOMAIN}:${PS_GATEWAY_IP}
      - api-databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  uploader-worker:
    logging: *default-logging
    extends:
      service: uploader-api-php
    image: ${REGISTRY_NAMESPACE}uploader-worker:${DOCKER_TAG}
    build:
      target: worker
    deploy:
      replicas: $UPLOADER_WORKER_REPLICAS

  # Never scale it: a schedule must be consumed by a single process.
  uploader-scheduler:
    logging: *default-logging
    extends:
      service: uploader-worker
    profiles: !reset
      - uploader-scheduler
    build: !reset null
    deploy:
      replicas: 1
    environment:
      - WORKER_PRIORITIES=scheduler_main
      - SCHEDULER_OFFSET

  uploader-api-nginx:
    logging: *default-logging
    profiles:
      - uploader
    image: ${REGISTRY_NAMESPACE}uploader-api-nginx:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./uploader/api/Dockerfile
      target: api-nginx
      args:
        BASE_TAG: ${DOCKER_TAG}
        REGISTRY_NAMESPACE: ${REGISTRY_NAMESPACE}
      network: host
      entitlements:
        - network.host
    environment:
      - UPLOAD_MAX_FILE_SIZE
    networks:
      proxy:
        aliases:
          - uploader-api
      app:
        aliases:
          - uploader-api
    depends_on:
      - uploader-api-php
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.uploader-api.rule=Host(`api-uploader.${PHRASEA_DOMAIN}`)"

  databox-client:
    logging: *default-logging
    extends:
      service: a_client
    image: ${REGISTRY_NAMESPACE}databox-client:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./databox/client/Dockerfile
    profiles:
      - databox
    environment:
      - S3_REQUEST_SIGNATURE_TTL=${DATABOX_REQUEST_SIGNATURE_TTL}
      - DATABOX_API_URL
      - DATABOX_CLIENT_URL
      - ALLOW_INDEXING=${DATABOX_CLIENT_ALLOW_INDEXING}
      - CLIENT_ID=${DATABOX_CLIENT_ID}
      - ALLOWED_FILE_TYPES=${DATABOX_ALLOWED_FILE_TYPES}
      - MAX_UPLOAD_FILE_SIZE=${DATABOX_MAX_UPLOAD_FILE_SIZE}
      - MAPBOX_TOKEN
      - CLOUD_FRONT_URL=${DATABOX_CLOUD_FRONT_URL}
      - KEYCLOAK_INTERNAL_URL
      - MATOMO_DISABLE_COOKIES
      - MATOMO_COOKIE_CONSENT
      - DATABOX_TICKETING_ENABLED
      - DATABOX_TICKETING_JIRA_URL
      - DATABOX_TICKETING_JIRA_USER
      - DATABOX_TICKETING_JIRA_API_TOKEN
      - DATABOX_TICKETING_JIRA_PROJECT_KEY
      - DATABOX_TICKETING_JIRA_ISSUE_TYPE
      - DATABOX_TICKETING_JIRA_BUG_ISSUE_TYPE
      - DATABOX_TICKETING_JIRA_LABELS
      - DATABOX_TICKETING_JIRA_API_VERSION
    # The link previews of the shares are read from the API by the server,
    # through traefik
    extra_hosts:
      - api-databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.databox-client.rule=Host(`databox.${PHRASEA_DOMAIN}`)"
      - "traefik.http.services.databox-client.loadbalancer.server.port=3000"

  expose-client:
    logging: *default-logging
    extends:
      service: a_client
    image: ${REGISTRY_NAMESPACE}expose-client:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./expose/client/Dockerfile
    profiles:
      - expose
    environment:
      - EXPOSE_API_URL
      - EXPOSE_CLIENT_URL
      - ALLOW_INDEXING=${EXPOSE_CLIENT_ALLOW_INDEXING}
      - CLIENT_ID=${EXPOSE_CLIENT_ID}
      - DISABLE_INDEX_PAGE=${EXPOSE_DISABLE_INDEX_PAGE}
      - ALLOWED_FRAME_ANCESTORS=${EXPOSE_ALLOWED_FRAME_ANCESTORS}
      - CLOUD_FRONT_URL=${EXPOSE_CLOUD_FRONT_URL}
      - MATOMO_DISABLE_COOKIES
      - MATOMO_COOKIE_CONSENT
    # The link previews of the publications are read from the API by the
    # server, through traefik
    extra_hosts:
      - api-expose.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.expose-client.rule=Host(`expose.${PHRASEA_DOMAIN}`)"
      - "traefik.http.services.expose-client.loadbalancer.server.port=3000"

  uploader-client:
    logging: *default-logging
    extends:
      service: a_client
    image: ${REGISTRY_NAMESPACE}uploader-client:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./uploader/client/Dockerfile
    profiles:
      - uploader
    environment:
      - UPLOADER_API_URL
      - UPLOADER_CLIENT_URL
      - ALLOW_INDEXING=${UPLOADER_CLIENT_ALLOW_INDEXING}
      - CLIENT_ID=${UPLOADER_CLIENT_ID}
      - ALLOWED_FILE_TYPES=${UPLOADER_ALLOWED_FILE_TYPES}
      - MATOMO_DISABLE_COOKIES
      - MATOMO_COOKIE_CONSENT
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.uploader-client.rule=Host(`uploader.${PHRASEA_DOMAIN}`)"
      - "traefik.http.services.uploader-client.loadbalancer.server.port=3000"

  expose-api-php:
    logging: *default-logging
    extends:
      service: a_s3-php
    profiles:
      - expose
    image: ${REGISTRY_NAMESPACE}expose-api-php:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./expose/api/Dockerfile
    environment:
      - DEV_MODE
      - RABBITMQ_VHOST=${EXPOSE_RABBITMQ_VHOST}
      - ADMIN_CLIENT_ID=${EXPOSE_ADMIN_CLIENT_ID}
      - ADMIN_CLIENT_SECRET=${EXPOSE_ADMIN_CLIENT_SECRET}
      - APP_SECRET=${EXPOSE_APP_SECRET}
      - S3_REQUEST_SIGNATURE_TTL=${EXPOSE_REQUEST_SIGNATURE_TTL}
      - S3_BUCKET_NAME=${EXPOSE_S3_BUCKET_NAME}
      # The MinIO user of the application when set (minio-setup): its bucket,
      # and config.json in the configurator bucket, pushed from the admin
      - S3_ACCESS_KEY=${EXPOSE_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - S3_SECRET_KEY=${EXPOSE_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - CONFIGURATOR_S3_ACCESS_KEY=${EXPOSE_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - CONFIGURATOR_S3_SECRET_KEY=${EXPOSE_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - EXPOSE_API_URL
      - EXPOSE_CLIENT_URL
      - UPLOAD_MAX_FILE_SIZE
      - MAX_UPLOAD_FILE_SIZE=${EXPOSE_MAX_UPLOAD_FILE_SIZE}
      - ALLOWED_FILE_TYPES=${EXPOSE_ALLOWED_FILE_TYPES}
      - MAPBOX_TOKEN
      - EXPOSE_CLIENT_LOGO_URL
      - EXPOSE_CLIENT_LOGO_ALT
      - NEWRELIC_APP_NAME=expose-api
      - CLOUD_FRONT_URL=${EXPOSE_CLOUD_FRONT_URL}
      - CLOUD_FRONT_REGION=${EXPOSE_CLOUD_FRONT_REGION}
      - CLOUD_FRONT_PRIVATE_KEY=${EXPOSE_CLOUD_FRONT_PRIVATE_KEY}
      - CLOUD_FRONT_KEY_PAIR_ID=${EXPOSE_CLOUD_FRONT_KEY_PAIR_ID}
      - CLOUD_FRONT_TTL=${EXPOSE_CLOUD_FRONT_TTL}
      - PHRASEANET_APP_OAUTH_TOKEN
      - PHRASEANET_URL
      - DB_NAME=${EXPOSE_DB_NAME}
      - POSTGRES_USER=${EXPOSE_POSTGRES_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${EXPOSE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    extra_hosts:
      - phraseanet.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  expose-worker:
    logging: *default-logging
    extends:
      service: expose-api-php
    image: ${REGISTRY_NAMESPACE}expose-worker:${DOCKER_TAG}
    build:
      target: worker
    deploy:
      replicas: $EXPOSE_WORKER_REPLICAS
    environment:
      - WORKER_PRIORITIES=p1

  # Never scale it: a schedule must be consumed by a single process.
  expose-scheduler:
    logging: *default-logging
    extends:
      service: expose-worker
    profiles: !reset
      - expose-scheduler
    build: !reset null
    deploy:
      replicas: 1
    environment:
      - WORKER_PRIORITIES=scheduler_main
      - SCHEDULER_OFFSET

  expose-api-nginx:
    logging: *default-logging
    profiles:
      - expose
    image: ${REGISTRY_NAMESPACE}expose-api-nginx:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./expose/api/Dockerfile
      target: api-nginx
      args:
        BASE_TAG: ${DOCKER_TAG}
        REGISTRY_NAMESPACE: ${REGISTRY_NAMESPACE}
      network: host
      entitlements:
        - network.host
    volumes:
      - expose_nginx_cache:/var/cache/nginx
    networks:
      - proxy
      - app
    depends_on:
      - expose-api-php
    environment:
      - UPLOAD_MAX_FILE_SIZE
      # The origin the proxy cache keeps apart (without it, the requests of the client bypass the cache)
      - EXPOSE_CLIENT_URL
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.expose-api.rule=Host(`api-expose.${PHRASEA_DOMAIN}`)"

  redis:
    logging: *default-logging
    profiles:
      - redis
    image: ${REDIS_IMAGE}
    networks:
      - data
    volumes:
      - redis:/data

  db:
    logging: *default-logging
    profiles:
      - db
    image: ${POSTGRES_IMAGE}
    hostname: postgres
    networks:
      - data
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - db:/var/lib/postgresql/data

  rabbitmq:
    logging: *default-logging
    profiles:
      - rabbitmq
    image: ${RABBITMQ_IMAGE}
    hostname: rabbitmq
    networks:
      - data
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_data"
      - "traefik.http.routers.rabbitmq-console.rule=Host(`rabbitmq-console.${PHRASEA_DOMAIN}`)"
      - "traefik.http.services.rabbitmq-console.loadbalancer.server.port=15672"
      # RabbitMQ authenticates with HTTP Basic itself: no basic auth layer here.
      - "traefik.http.routers.rabbitmq-console.middlewares=admin-allowlist@docker"

  dockerize:
    logging: *default-logging
    profiles:
      - dockerize
    image: jwilder/dockerize:0.6.1
    networks:
      - data
    command:
      - "-wait"
      - "tcp://db:5432"
      - "-wait"
      - "tcp://rabbitmq:5672"
      - "-wait"
      # An HTTP wait would get a 401: Elasticsearch requires authentication.
      - "tcp://elasticsearch:9200"
      - "-wait"
      - "tcp://minio:9000"
      - "-timeout"
      - "200s"
      - "--"
      - "echo"
      - "ready"

  minio:
    logging: *default-logging
    profiles:
      - minio
    image: ${MINIO_IMAGE}
    networks:
      - data
    command: server /data --console-address :9001
    volumes:
      - s3:/data
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_CONSOLE_URL}
      - MINIO_NOTIFY_AMQP_ENABLE_PRIMARY=on
      - MINIO_NOTIFY_AMQP_URL_PRIMARY=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/s3events
      - MINIO_NOTIFY_AMQP_EXCHANGE_PRIMARY=s3events
      - MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_PRIMARY=direct
      - MINIO_NOTIFY_AMQP_DURABLE_PRIMARY=on
      - MINIO_NOTIFY_AMQP_MANDATORY_PRIMARY=off
      - MINIO_NOTIFY_AMQP_NO_WAIT_PRIMARY=off
      - MINIO_NOTIFY_AMQP_INTERNAL_PRIMARY=off
      - MINIO_NOTIFY_AMQP_AUTO_DELETED_PRIMARY=off
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_data"
      - "traefik.http.routers.minio.rule=Host(`minio.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.routers.minio-console.middlewares=admin-console@docker"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  # Creates or updates, as the root user, the MinIO user of each consumer whose
  # *_S3_ACCESS_KEY/*_S3_SECRET_KEY pair is set, restricted to its bucket, then
  # exits (nothing to do without any pair). It waits for MinIO but does not start
  # it. bin/setup.sh, bin/migrate.sh and bin/test.sh run it (setup_minio_users)
  # when the `minio` profile is active.
  minio-setup:
    logging: *default-logging
    profiles:
      - setup
    image: ${MINIO_MC_IMAGE}
    networks:
      - data
    entrypoint: ["/bin/bash", "/usr/local/bin/minio-setup.sh"]
    volumes:
      - ./infra/docker/minio-setup/setup.sh:/usr/local/bin/minio-setup.sh:ro
    environment:
      - S3_INTERNAL_URL
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_PATH_PREFIX
      - CONFIGURATOR_S3_BUCKET_NAME
      - DATABOX_S3_BUCKET_NAME
      - EXPOSE_S3_BUCKET_NAME
      - UPLOADER_S3_BUCKET_NAME
      - INDEXER_BUCKET_NAME
      - DATABOX_S3_ACCESS_KEY
      - DATABOX_S3_SECRET_KEY
      - EXPOSE_S3_ACCESS_KEY
      - EXPOSE_S3_SECRET_KEY
      - UPLOADER_S3_ACCESS_KEY
      - UPLOADER_S3_SECRET_KEY
      - CONFIG_READER_S3_ACCESS_KEY
      - CONFIG_READER_S3_SECRET_KEY
      - INDEXER_S3_ACCESS_KEY
      - INDEXER_S3_SECRET_KEY

  matomo-php:
    logging: *default-logging
    profiles:
      - matomo
    image: ${REGISTRY_NAMESPACE}matomo-php:${DOCKER_TAG}
    build:
      context: ./infra/docker/matomo-php
      network: host
      entitlements:
        - network.host
    networks:
      - app
      - data
      - egress
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_USERNAME
      - MATOMO_DATABASE_PASSWORD
      - MATOMO_DATABASE_DBNAME
    volumes:
      - matomo:/var/www/html

  matomo-nginx:
    logging: *default-logging
    profiles:
      - matomo
    image: ${REGISTRY_NAMESPACE}matomo-nginx:${DOCKER_TAG}
    build:
      context: ./infra/docker/matomo-nginx
      network: host
      entitlements:
        - network.host
    networks:
      - proxy
      - app
    depends_on:
      - matomo-php
    volumes:
      - matomo:/var/www/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.matomo.rule=Host(`matomo.${PHRASEA_DOMAIN}`)"

  matomo-db:
    logging: *default-logging
    profiles:
      - matomo-db
    image: mariadb:10.4.10-bionic
    command:
      - "mysqld"
      - "--max_allowed_packet=64MB"
    networks:
      data:
        aliases:
          - matomo-db
    environment:
      - MYSQL_ROOT_PASSWORD=$MATOMO_MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=$MATOMO_DATABASE_DBNAME
      - MYSQL_USER=$MATOMO_DATABASE_USERNAME
      - MYSQL_PASSWORD=$MATOMO_DATABASE_PASSWORD
    volumes:
      - matomodb:/var/lib/mysql

  report-api:
    logging: *default-logging
    profiles:
      - report
    image: ${REPORT_API_IMAGE}
    networks:
      - data
    environment:
      - APP_ENV
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_USER=${REPORT_POSTGRES_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${REPORT_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      - POSTGRES_DATABASE=${REPORT_DB_NAME}

  pgadmin:
    logging: *default-logging
    profiles:
      - pgadmin
    image: dpage/pgadmin4:9.11.0
    networks:
      - data
    environment:
      - PGADMIN_DEFAULT_EMAIL
      - PGADMIN_DEFAULT_PASSWORD
      - PGADMIN_SERVER_JSON_FILE=/data/server.json
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./infra/docker/pgadmin/server.json:/data/server.json
      - ./infra/docker/pgadmin/passfile:/data/passfile
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_data"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.pgadmin.middlewares=admin-console@docker"

  phpmyadmin:
    logging: *default-logging
    profiles:
      - phpmyadmin
    image: phpmyadmin/phpmyadmin
    networks:
      - data
    environment:
      - PMA_HOST=matomo-db
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_data"
      - "traefik.http.routers.phpmyadmin.rule=Host(`pma.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.phpmyadmin.middlewares=admin-console@docker"

  mailpit:
    logging: *default-logging
    profiles:
      - mailpit
    image: ${MAILPIT_IMAGE}
    networks:
      - data
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_data"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.${PHRASEA_DOMAIN}`)"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "traefik.http.routers.mailpit.middlewares=admin-console@docker"

  dashboard-client:
    logging: *default-logging
    extends:
      service: a_client
    image: ${REGISTRY_NAMESPACE}dashboard:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./dashboard/client/Dockerfile
    profiles:
      - dashboard
    environment:
      - DASHBOARD_CLIENT_URL
      - ALLOW_INDEXING=${DASHBOARD_CLIENT_ALLOW_INDEXING}
      - CLIENT_ID=${DASHBOARD_CLIENT_ID}
      - DATABOX_API_URL
      - DATABOX_CLIENT_URL
      - EXPOSE_API_URL
      - EXPOSE_CLIENT_URL
      - UPLOADER_API_URL
      - UPLOADER_CLIENT_URL
      - PARADE_CLIENT_URL
      - CONSENT_CLIENT_URL
      - LEND_CLIENT_URL
      - ORDER_CLIENT_URL
      - DASHBOARD_DOCUMENTATION_URL
      - MAILPIT_URL
      - PGADMIN_URL
      - PHPMYADMIN_URL
      - RABBITMQ_CONSOLE_URL
      - TRAEFIK_CONSOLE_URL
      - SOCKUDO_USAGE_URL
      - STACK_NAME=${COMPOSE_PROJECT_NAME}
      - STACK_VERSION=${DOCKER_TAG}
      - MATOMO_DISABLE_COOKIES
      - MATOMO_COOKIE_CONSENT
    # The status of the APIs is probed from the server, through traefik
    extra_hosts:
      - api-databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-expose.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-uploader.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.${PHRASEA_DOMAIN}`)"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"

  databox-api-php:
    logging: *default-logging
    extends:
      service: a_s3-php
    profiles:
      - databox
    image: ${REGISTRY_NAMESPACE}databox-api-php:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./databox/api/Dockerfile
    environment:
      - DATABOX_API_URL
      - DATABOX_CLIENT_URL
      - RABBITMQ_VHOST=${DATABOX_RABBITMQ_VHOST}
      - ADMIN_CLIENT_ID=${DATABOX_ADMIN_CLIENT_ID}
      - ADMIN_CLIENT_SECRET=${DATABOX_ADMIN_CLIENT_SECRET}
      - APP_SECRET=${DATABOX_APP_SECRET}
      - EXPOSE_API_URL
      - EXPOSE_ADMIN_CLIENT_ID=${EXPOSE_ADMIN_CLIENT_ID}
      - EXPOSE_ADMIN_CLIENT_SECRET=${EXPOSE_ADMIN_CLIENT_SECRET}
      # The only Uploader allowed on the private network, with its S3 storage (S3_ENDPOINT)
      - UPLOADER_API_URL
      # Other origins allowed on the private network (see .env)
      - INTEGRATION_PRIVATE_ORIGINS=${DATABOX_INTEGRATION_PRIVATE_ORIGINS}
      - WEBHOOK_PRIVATE_ORIGINS=${DATABOX_WEBHOOK_PRIVATE_ORIGINS}
      - ELASTICSEARCH_URL
      - ELASTICSEARCH_USERNAME
      - ELASTICSEARCH_PASSWORD
      - ELASTICSEARCH_INDEX_PREFIX
      - SIMILARITY_EMBEDDER_URL=http://similarity-embedder:8000
      - FACE_RECOGNITION_URL=http://face-recognition:8000
      - S3_PATH_PREFIX
      - S3_REQUEST_SIGNATURE_TTL=${DATABOX_REQUEST_SIGNATURE_TTL}
      - S3_BUCKET_NAME=${DATABOX_S3_BUCKET_NAME}
      # The MinIO user of the application when set (minio-setup): its bucket,
      # and config.json in the configurator bucket, pushed from the admin
      - S3_ACCESS_KEY=${DATABOX_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - S3_SECRET_KEY=${DATABOX_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - CONFIGURATOR_S3_ACCESS_KEY=${DATABOX_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - CONFIGURATOR_S3_SECRET_KEY=${DATABOX_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - UPLOAD_MAX_FILE_SIZE
      - MAX_UPLOAD_FILE_SIZE=${DATABOX_MAX_UPLOAD_FILE_SIZE}
      - ALLOWED_FILE_TYPES=${DATABOX_ALLOWED_FILE_TYPES}
      - DATABOX_MAX_RENDITION_BUILD_TIME
      - NEWRELIC_APP_NAME=databox-api
      - CLOUD_FRONT_URL=${DATABOX_CLOUD_FRONT_URL}
      - CLOUD_FRONT_REGION=${DATABOX_CLOUD_FRONT_REGION}
      - CLOUD_FRONT_PRIVATE_KEY=${DATABOX_CLOUD_FRONT_PRIVATE_KEY}
      - CLOUD_FRONT_KEY_PAIR_ID=${DATABOX_CLOUD_FRONT_KEY_PAIR_ID}
      - CLOUD_FRONT_TTL=${DATABOX_CLOUD_FRONT_TTL}
      - CLARIFAI_API_KEY
      - SECRETS_PUBLIC_KEY=${DATABOX_SECRETS_PUBLIC_KEY}
      - PWI_PHRASEANET_URL=${PHRASEANET_URL}
      - PWI_PHRASEANET_API_TOKEN=${PHRASEANET_APP_OAUTH_TOKEN}
      - PWI_EXPOSE_API_URL=${EXPOSE_API_URL}
      - PWI_EXPOSE_CLIENT_URL=${EXPOSE_CLIENT_URL}
      - PWI_UPLOADER_API_URL=${UPLOADER_API_URL}
      # Reached directly on the internal network: going through Traefik would
      # need the public HTTPS port, which is not 443 on every stack (CI).
      - SOCKUDO_HOST=sockudo
      - SOCKUDO_PORT=6001
      - SOCKUDO_SCHEME=http
      - SOCKUDO_APP_ID
      - SOCKUDO_KEY
      - SOCKUDO_SECRET
      - DB_NAME=${DATABOX_DB_NAME}
      - POSTGRES_USER=${DATABOX_POSTGRES_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${DATABOX_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      - PWI_DATABOX_EXPOSE_INTEGRATION_CLIENT_ID=${DATABOX_EXPOSE_INTEGRATION_CLIENT_ID}
      - API_ASSET_OWNER_PROPERTY_REQUIRED_ROLE=${DATABOX_API_ASSET_OWNER_PROPERTY_REQUIRED_ROLE}
      - API_COLLECTION_OWNER_PROPERTY_REQUIRED_ROLE=${DATABOX_API_COLLECTION_OWNER_PROPERTY_REQUIRED_ROLE}
      - AUDIT_LOG_RETENTION_DAYS=${DATABOX_AUDIT_LOG_RETENTION_DAYS}
    extra_hosts:
      - api-uploader.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-expose.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - ${PHRASEANET_DOMAIN}:${PS_GATEWAY_IP}
      - webhook-endpoint.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - matomo.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  databox-worker:
    logging: *default-logging
    extends:
      service: databox-api-php
    image: ${REGISTRY_NAMESPACE}databox-worker:${DOCKER_TAG}
    build:
      target: worker
    deploy:
      replicas: $DATABOX_WORKER_REPLICAS
      resources:
        limits:
          cpus: ${DATABOX_WORKER_CPU_LIMIT}
          memory: ${DATABOX_WORKER_MEMORY_LIMIT}
    environment:
      - SECRETS_SECRET_KEY=${DATABOX_SECRETS_SECRET_KEY}
      - WORKER_PRIORITIES=p1 p1,p2,bulk p1,p2,heavy,heavy_low,bulk,bulk_heavy,bulk_heavy_low task
      - IMAGICK_VERSION
      - IMAGEMAGICK_POLICY_MEMORY
      - IMAGEMAGICK_POLICY_VERSION
      - IMAGEMAGICK_POLICY_WIDTH
      - IMAGEMAGICK_POLICY_HEIGHT
      - IMAGEMAGICK_POLICY_TIME
      - IMAGEMAGICK_POLICY_LIST_LENGTH
      - IMAGEMAGICK_POLICY_MAP
      - IMAGEMAGICK_POLICY_AREA
      - IMAGEMAGICK_POLICY_DISK
      - IMAGEMAGICK_POLICY_TEMPORARY_PATH

  # Never scale it: a schedule must be consumed by a single process.
  databox-scheduler:
    logging: *default-logging
    profiles: !reset
      - databox-scheduler
    extends:
      service: databox-worker
    build: !reset null
    deploy:
      replicas: 1
    environment:
      - WORKER_PRIORITIES=scheduler_main
      - SCHEDULER_OFFSET

  databox-api-nginx:
    logging: *default-logging
    profiles:
      - databox
    image: ${REGISTRY_NAMESPACE}databox-api-nginx:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./databox/api/Dockerfile
      target: api-nginx
      args:
        BASE_TAG: ${DOCKER_TAG}
        REGISTRY_NAMESPACE: ${REGISTRY_NAMESPACE}
      network: host
      entitlements:
        - network.host
    networks:
      proxy:
        aliases:
          - databox-api
      app:
        aliases:
          - databox-api
    environment:
      - UPLOAD_MAX_FILE_SIZE
    depends_on:
      - databox-api-php
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.databox-api.rule=Host(`api-databox.${PHRASEA_DOMAIN}`)"

  databox-indexer:
    logging: *default-logging
    image: ${REGISTRY_NAMESPACE}databox-indexer:${DOCKER_TAG}
    command: [ "/bin/sh", "-c", "exit" ]
    build:
      context: ./
      dockerfile: ./databox/indexer/Dockerfile
      args:
        BASE_TAG: ${DOCKER_TAG}
        REGISTRY_NAMESPACE: ${REGISTRY_NAMESPACE}
        SENTRY_RELEASE: ${SENTRY_RELEASE}
      network: host
      entitlements:
        - network.host
    profiles:
      - indexer
    networks:
      - proxy
      - data
    environment:
      - AMQP_DSN=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/s3events
      - IMPORT_FILES=${INDEXER_IMPORT_FILES}
      - CONFIG_FILE=${INDEXER_CONFIG_FILE}
      - INDEXER_LOCK_DIR=${INDEXER_LOCK_DIR}
      - DATABOX_API_URL
      - DATABOX_VERIFY_SSL=${VERIFY_SSL}
      - DATABOX_CLIENT_ID=${INDEXER_DATABOX_CLIENT_ID}
      - DATABOX_CLIENT_SECRET=${INDEXER_DATABOX_CLIENT_SECRET}
      - DATABOX_CONCURRENCY=${INDEXER_DATABOX_CONCURRENCY}
      - DATABOX_WORKSPACE_SLUG=${INDEXER_DATABOX_WORKSPACE_SLUG}
      - DATABOX_OWNER_ID=${INDEXER_DATABOX_OWNER_ID}
      - PUBLIC_URL=${DATABOX_INDEXER_URL}
      - S3_ENDPOINT
      - S3_PATH_PREFIX
      - S3_REQUEST_SIGNATURE_TTL=${DATABOX_REQUEST_SIGNATURE_TTL}
      # Read-only on its bucket when set (minio-setup)
      - S3_ACCESS_KEY=${INDEXER_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      - S3_SECRET_KEY=${INDEXER_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      - S3_REGION
      - S3_BUCKET_NAME=${INDEXER_BUCKET_NAME}
      - BUCKET_NAMES=${INDEXER_BUCKET_NAME}
      - WATCH_DIR=${INDEXER_WATCH_DIR}
      - WATCH_DIR_PREFIX=${INDEXER_WATCH_DIR_PREFIX}
      - WATCH_SOURCE_DIR=${INDEXER_WATCH_SOURCE_DIR}
      - PHRASEANET_URL
      - PHRASEANET_APP_OAUTH_TOKEN
      - PHRASEANET_VERIFY_SSL
      - PHRASEANET_DATABOX=${INDEXER_PHRASEANET_DATABOX}
      - PHRASEANET_COLLECTIONS=${INDEXER_PHRASEANET_COLLECTIONS}
      - PHRASEANET_SEARCH_QUERY=${INDEXER_PHRASEANET_SEARCH_QUERY}
      - PHRASEANET_SEARCH_ORDER=${INDEXER_PHRASEANET_SEARCH_ORDER}
      - PHRASEANET_RECORDS_COLLECTION_PATH=${INDEXER_RECORDS_COLLECTION_PATH}
      - PHRASEANET_STORIES_COLLECTION_PATH=${INDEXER_STORIES_COLLECTION_PATH}
    volumes:
      - ./databox/indexer/config:/srv/workspace/phrasea/databox/indexer/config
      - ${INDEXER_WATCH_SOURCE_DIR}:${INDEXER_WATCH_DIR}
    extra_hosts:
      - api-databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - minio.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - ${PHRASEANET_DOMAIN}:${PS_GATEWAY_IP}
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.databox-indexer.rule=Host(`databox-indexer.${PHRASEA_DOMAIN}`)"

  elasticsearch:
    logging: *default-logging
    profiles:
      - elasticsearch
    image: ${ELASTICSEARCH_IMAGE}
    networks:
      - data
    volumes:
      - elasticsearch9:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: ${ELASTICSEARCH_CPU_LIMIT}
          memory: ${ELASTICSEARCH_MEMORY_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      # Password of the `elastic` superuser, only used by elasticsearch-setup:
      # the applications get their own user, restricted to their indices.
      - ELASTIC_PASSWORD
      - xpack.security.enabled=true
      # No TLS: Elasticsearch is only reachable from the internal `data` network.
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - discovery.type=single-node
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS}

  # Creates or updates the user of the applications (ELASTICSEARCH_USERNAME) and
  # its role, restricted to the ELASTICSEARCH_INDEX_PREFIX indices, then exits.
  # Run at every `up`; bin/setup.sh, bin/migrate.sh and bin/test.sh run it in the
  # foreground (setup_elasticsearch_users) before anything uses Elasticsearch.
  elasticsearch-setup:
    logging: *default-logging
    profiles:
      - elasticsearch
    image: ${ELASTICSEARCH_IMAGE}
    networks:
      - data
    depends_on:
      - elasticsearch
    entrypoint: ["/bin/bash", "/usr/local/bin/setup-users.sh"]
    volumes:
      - ./infra/docker/elasticsearch/setup-users.sh:/usr/local/bin/setup-users.sh:ro
    environment:
      - ELASTIC_PASSWORD
      - ELASTICSEARCH_USERNAME
      - ELASTICSEARCH_PASSWORD
      - ELASTICSEARCH_INDEX_PREFIX

  similarity-embedder:
    logging: *default-logging
    profiles:
      - similarity
    image: ${SIMILARITY_EMBEDDER_IMAGE}
    # The models are in the image, and `data` has no Internet: no check against the Hub.
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  face-recognition:
    logging: *default-logging
    profiles:
      - face-recognition
    image: ${FACE_RECOGNITION_IMAGE}
    # `data` has no Internet: no version check at startup.
    environment:
      - NO_ALBUMENTATIONS_UPDATE=1
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  k6:
    logging: *default-logging
    profiles:
      - loadtest
    image: grafana/k6:0.26.2
    networks:
      - data
      - egress
    command: '' # Manually run 'dc run --rm k6 run /scripts/src/main.js'
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    volumes:
      - ./infra/load-test:/scripts
    extra_hosts:
      - expose.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-expose.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - minio.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  influxdb:
    logging: *default-logging
    image: influxdb:1.8
    profiles:
      - loadtest
    networks:
      - data
    environment:
      - INFLUXDB_DB=k6

  grafana:
    logging: *default-logging
    image: grafana/grafana:8.4.2
    profiles:
      - loadtest
    networks:
      - data
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./infra/docker/grafana:/etc/grafana/provisioning
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_data"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.grafana.middlewares=admin-console@docker"

  webhook-endpoint:
    logging: *default-logging
    image: mendhak/http-https-echo:23
    profiles:
      - webhooks
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.webhook-endpoint.rule=Host(`webhook-endpoint.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.webhook-endpoint.middlewares=admin-console@docker"

  keycloak:
    logging: *default-logging
    image: ${KEYCLOAK_IMAGE}
    command:
      - 'start'
      - '--optimized'
    restart: on-failure:30
    networks:
      - proxy
      - data
    environment:
      - DASHBOARD_CLIENT_URL
      - KC_LOGIN_CSS_BACKGROUND
      - KC_LOGIN_CSS_LOGO_BACKGROUND
      - KC_LOGIN_DISPLAY_DASHBOARD_LINK
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_PROXY_TRUSTED_ADDRESSES=${TRUSTED_PROXIES}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME=https://keycloak.${PHRASEA_DOMAIN}${HTTPS_PORT_PREFIX}
      - KC_DB_USERNAME=${KEYCLOAK_POSTGRES_USER:-${POSTGRES_USER}}
      - KC_DB_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${KEYCLOAK_DB_NAME}
    extra_hosts:
      - keycloak2.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.${PHRASEA_DOMAIN}`)"
      - "traefik.http.routers.keycloak.service=keycloak"
      # Super-admin console: its JavaScript sends its own Bearer token, so no basic auth layer.
      - "traefik.http.routers.keycloak-master.rule=Host(`keycloak.${PHRASEA_DOMAIN}`) && (PathPrefix(`/admin/master`) || PathPrefix(`/realms/master`))"
      - "traefik.http.routers.keycloak-master.priority=1000"
      - "traefik.http.routers.keycloak-master.service=keycloak"
      - "traefik.http.routers.keycloak-master.middlewares=admin-allowlist@docker"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  keycloak2:
    logging: *default-logging
    image: ${KEYCLOAK_IMAGE}
    command:
      - 'start'
      - '--optimized'
    networks:
      - proxy
      - data
    profiles:
      - openid
    environment:
      - DASHBOARD_CLIENT_URL
      - KC_PROXY=edge
      - KEYCLOAK_ADMIN=${KEYCLOAK2_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK2_ADMIN_PASSWORD}
      - KC_HOSTNAME=https://keycloak2.${PHRASEA_DOMAIN}${HTTPS_PORT_PREFIX}
      - KC_DB_USERNAME=${KEYCLOAK_POSTGRES_USER:-${POSTGRES_USER}}
      - KC_DB_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${KEYCLOAK2_DB_NAME}
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.keycloak2.rule=Host(`keycloak2.${PHRASEA_DOMAIN}`)"
      - "traefik.http.services.keycloak2.loadbalancer.server.port=8080"

  configurator:
    logging: *default-logging
    image: ${REGISTRY_NAMESPACE}configurator:${DOCKER_TAG}
    build:
      context: ./
      dockerfile: ./configurator/Dockerfile
      args:
        BASE_TAG: ${DOCKER_TAG}
        REGISTRY_NAMESPACE: ${REGISTRY_NAMESPACE}
      network: host
      entitlements:
        - network.host
    networks:
      - data
      - egress
    profiles:
      - configurator
    environment:
      - CONFIGURATOR_SERVICE_WAIT_TIMEOUT
      - CONFIGURATOR_CONFIGURE_DATABASE
      - CONFIGURATOR_CONFIGURE_KEYCLOAK
      - CONFIGURATOR_CONFIGURE_MINIO
      - CONFIGURATOR_CONFIGURE_RABBITMQ
      - CONFIGURATOR_CONFIGURE_S3
      - APP_ENV
      - KEYCLOAK_URL
      - KEYCLOAK_INTERNAL_URL
      - KEYCLOAK_REALM_NAME
      - KEYCLOAK_ADMIN
      - KEYCLOAK_ADMIN_PASSWORD
      - VERIFY_SSL
      - VERIFY_HOST
      - DATABOX_API_URL
      - EXPOSE_API_URL
      - UPLOADER_API_URL
      - EXPOSE_ADMIN_CLIENT_ID
      - EXPOSE_ADMIN_CLIENT_SECRET
      - UPLOADER_ADMIN_CLIENT_ID
      - UPLOADER_ADMIN_CLIENT_SECRET
      - DATABOX_ADMIN_CLIENT_ID
      - DATABOX_ADMIN_CLIENT_SECRET
      - DATABOX_CLIENT_ID
      - EXPOSE_CLIENT_ID
      - UPLOADER_CLIENT_ID
      - DASHBOARD_CLIENT_ID
      - DATABOX_CLIENT_URL
      - EXPOSE_CLIENT_URL
      - UPLOADER_CLIENT_URL
      - DASHBOARD_CLIENT_URL
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST
      - POSTGRES_PORT
      - CONFIGURATOR_DB_NAME
      - AUTH_DB_NAME
      - DATABOX_DB_NAME
      - EXPOSE_DB_NAME
      - UPLOADER_DB_NAME
      - MAIL_FROM
      - MAIL_FROM_DISPLAY_NAME
      - MAIL_REPLY_TO
      - MAIL_REPLY_TO_DISPLAY_NAME
      - MAIL_ENVELOPE_FROM
      - MAILER_DSN
      - MAILER_HOST
      - MAILER_PORT
      - MAILER_USER
      - MAILER_PASSWORD
      - MAILER_SSL
      - MAILER_TLS
      - DEFAULT_ADMIN_USERNAME
      - DEFAULT_ADMIN_EMAIL
      - DEFAULT_ADMIN_PASSWORD
      - INDEXER_DATABOX_CLIENT_ID
      - INDEXER_DATABOX_CLIENT_SECRET
      - PHRASEA_DOMAIN
      - KC_REALM_SUPPORTED_LOCALES
      - KC_REALM_DEFAULT_LOCALE
      - KC_REALM_HTML_DISPLAY_NAME
      - KC_REALM_LOGIN_REGISTRATION_ALLOWED
      - KC_REALM_LOGIN_RESET_PASSWORD_ALLOWED
      - KC_REALM_LOGIN_REMEMBER_ME_ALLOWED
      - KC_REALM_LOGIN_WITH_EMAIL_ALLOWED
      - KC_REALM_LOGIN_VERIFY_EMAIL_ALLOWED
      - KC_REALM_LOGIN_EMAIL_AS_USERNAME
      - KC_REALM_LOGIN_EDIT_USERNAME
      - KC_REALM_SSO_SESSION_IDLE_TIMEOUT
      - KC_REALM_SSO_SESSION_MAX_LIFESPAN
      - KC_REALM_CLIENT_SESSION_IDLE_TIMEOUT
      - KC_REALM_CLIENT_SESSION_MAX_LIFESPAN
      - KC_REALM_OFFLINE_SESSION_IDLE_TIMEOUT
      - KC_REALM_OFFLINE_SESSION_MAX_LIFESPAN
      - KC_REALM_USER_EVENT_ENABLED
      - KC_REALM_USER_EVENT_EXPIRATION
      - KC_REALM_ADMIN_EVENT_ENABLED
      - KC_REALM_ADMIN_EVENT_EXPIRATION
      - KEYCLOAK_ADMIN_PASSWORD_IS_DEFINITIVE
      - RABBITMQ_CONSOLE_URL
      - RABBITMQ_MANAGEMENT_URL
      - RABBITMQ_HOST
      - RABBITMQ_USER
      - RABBITMQ_PORT
      - RABBITMQ_PASSWORD
      - DATABOX_RABBITMQ_VHOST
      - EXPOSE_RABBITMQ_VHOST
      - UPLOADER_RABBITMQ_VHOST
      - CONFIGURATOR_S3_BUCKET_NAME
      - DATABOX_S3_BUCKET_NAME
      - EXPOSE_S3_BUCKET_NAME
      - UPLOADER_S3_BUCKET_NAME
      - INDEXER_BUCKET_NAME
      - S3_ENDPOINT
      - S3_INTERNAL_URL
      - S3_USE_PATH_STYLE_ENDPOINT
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_REGION
      - S3_PATH_PREFIX
      - VERIFY_SSL
      - MINIO_NOTIFY_AMQP_ARN
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - REPORT_DB_NAME
      - KEYCLOAK_DB_NAME
      - KEYCLOAK2_DB_NAME
      - DATABOX_POSTGRES_USER
      - DATABOX_POSTGRES_PASSWORD
      - EXPOSE_POSTGRES_USER
      - EXPOSE_POSTGRES_PASSWORD
      - UPLOADER_POSTGRES_USER
      - UPLOADER_POSTGRES_PASSWORD
      - KEYCLOAK_POSTGRES_USER
      - KEYCLOAK_POSTGRES_PASSWORD
      - REPORT_POSTGRES_USER
      - REPORT_POSTGRES_PASSWORD
      - DATABOX_EXPOSE_INTEGRATION_CLIENT_ID
    volumes:
      - ./tmp/configurator-output:/output
    extra_hosts:
      - keycloak.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - minio.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  cypress:
    logging: *default-logging
    build:
      context: ./cypress
    profiles:
      - cypress
    deploy:
      resources:
        limits:
          cpus: ${CYPRESS_CPU_LIMIT}
          memory: ${CYPRESS_MEMORY_LIMIT}
    environment:
      - CYPRESS_BASE_URL=${DASHBOARD_CLIENT_URL}
      - MAILPIT_URL
      - CYPRESS_EXPOSE_CLIENT_URL=${EXPOSE_CLIENT_URL}
      - CYPRESS_EXPOSE_API_URL=${EXPOSE_API_URL}
      - CYPRESS_KEYCLOAK_URL=${KEYCLOAK_URL}
      - CYPRESS_KEYCLOAK_REALM_NAME=${KEYCLOAK_REALM_NAME}
      - CYPRESS_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
      - CYPRESS_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - CYPRESS_EXPOSE_ADMIN_CLIENT_ID=${EXPOSE_ADMIN_CLIENT_ID}
      - CYPRESS_EXPOSE_ADMIN_CLIENT_SECRET=${EXPOSE_ADMIN_CLIENT_SECRET}
      - CYPRESS_DASHBOARD_CLIENT_URL=${DASHBOARD_CLIENT_URL}
      - DEFAULT_COMMAND_TIMEOUT=15000
      # Databox e2e tests
      - CYPRESS_DATABOX_CLIENT_URL=${DATABOX_CLIENT_URL}
      - CYPRESS_DATABOX_API_URL=${DATABOX_API_URL}
      - CYPRESS_DATABOX_CLIENT_ID=${DATABOX_CLIENT_ID}
      - CYPRESS_DATABOX_ADMIN_CLIENT_ID=${DATABOX_ADMIN_CLIENT_ID}
      - CYPRESS_DATABOX_ADMIN_CLIENT_SECRET=${DATABOX_ADMIN_CLIENT_SECRET}
      # Uploader e2e tests
      - CYPRESS_UPLOADER_CLIENT_URL=${UPLOADER_CLIENT_URL}
      - CYPRESS_UPLOADER_API_URL=${UPLOADER_API_URL}
      - CYPRESS_UPLOADER_CLIENT_ID=${UPLOADER_CLIENT_ID}
    volumes:
      - cypress_output:/cypress/output
    extra_hosts:
      - expose.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-expose.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - dashboard.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - minio.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - keycloak.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-databox.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - ws.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - uploader.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}
      - api-uploader.${PHRASEA_DOMAIN}:${PS_GATEWAY_IP}

  sockudo:
    logging: *default-logging
    profiles:
      - sockudo
    image: ${SOCKUDO_IMAGE}
    networks:
      - data
    environment:
      - SOCKUDO_DEFAULT_APP_ID=${SOCKUDO_APP_ID}
      - SOCKUDO_DEFAULT_APP_KEY=${SOCKUDO_KEY}
      - SOCKUDO_DEFAULT_APP_SECRET=${SOCKUDO_SECRET}
      - SOCKUDO_DEFAULT_APP_MAX_CONNECTIONS=100
      # The app key is public: the clients only receive events (channels are
      # all private, authorized by the APIs) and connect from these origins.
      - SOCKUDO_DEFAULT_APP_ENABLE_CLIENT_MESSAGES=false
      - SOCKUDO_DEFAULT_APP_ALLOWED_ORIGINS=${DATABOX_CLIENT_URL},${EXPOSE_CLIENT_URL},${UPLOADER_CLIENT_URL},${DASHBOARD_CLIENT_URL}
      # Single node: explicit drivers rather than the example config bundled
      # in the image.
      - ADAPTER_DRIVER=local
      - CACHE_DRIVER=memory
      - QUEUE_DRIVER=memory
      - APP_MANAGER_DRIVER=memory
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6001/up/${SOCKUDO_APP_ID}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.project_name=${COMPOSE_PROJECT_NAME}"
      # /usage, /stats and /operator are served on the app port: only /usage
      # is exposed, on its own host.
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_data"
      - "traefik.http.routers.sockudo.rule=Host(`ws.${PHRASEA_DOMAIN}`) && !PathPrefix(`/usage`) && !PathPrefix(`/stats`) && !PathPrefix(`/operator`)"
      - "traefik.http.routers.sockudo.service=sockudo"
      - "traefik.http.routers.sockudo-usage.rule=Host(`ws-usage.${PHRASEA_DOMAIN}`) && Path(`/usage`)"
      - "traefik.http.routers.sockudo-usage.service=sockudo"
      - "traefik.http.routers.sockudo-usage.middlewares=admin-console@docker"
      - "traefik.http.services.sockudo.loadbalancer.server.port=6001"

volumes:
  db:
  redis:
  uploader: # rw-many
  s3:
  matomo:
  matomodb:
  pgadmin:
  rabbitmq:
  elasticsearch9:
  expose_nginx_cache:
  cypress_output:
