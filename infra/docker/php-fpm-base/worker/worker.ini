[program:messenger-consume-${WORKER_PROGRAM}]
directory=/srv/app
environment=HOME="/tmp"
command=./bin/console messenger:consume ${WORKER_RECEIVERS} ${WORKER_VERBOSITY} --limit=${WORKER_LIMIT} --time-limit=${WORKER_TIME_LIMIT} --keepalive=30 --no-reset
user=1000
numprocs=${WORKER_NUMPROCS}
startsecs=$SUPERVISOR_START_SECS
startretries=$SUPERVISOR_START_RETRIES
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=$SUPERVISOR_STOP_WAIT_SECS
