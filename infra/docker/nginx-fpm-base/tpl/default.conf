# The container healthcheck polls /favicon.ico?healthcheck every minute; keep it out
# of the access log so real traffic stays readable in `docker logs`.
map $request_uri $ps_loggable {
    ~*healthcheck  0;
    default        1;
}

# "combined" plus the timings: rt = whole request, urt = PHP-FPM response (queue included),
# uct = connection to PHP-FPM. A urt much longer than the duration PHP itself measures
# (Server-Timing "app") is time spent waiting for a free FPM worker.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';

server {
    root /srv/app/public;

    access_log /var/log/nginx/access.log timed if=$ps_loggable;

    server_tokens off;

    client_max_body_size $UPLOAD_MAX_FILE_SIZE;

    # The request line must fit in one of these buffers (8k by default, 414
    # beyond): search conditions and id lists go in the query string.
    large_client_header_buffers 4 32k;

    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-ancestors 'self' ${DASHBOARD_CLIENT_URL}";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    location / {
        location ~* \.(eot|otf|svg|jpe?g|git|png|ttf|woff|woff2)$ {
            add_header Access-Control-Allow-Origin *;
            expires max;
        }

        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # fastcgi_pass, with runtime resolution on a Docker network (see entrypoint.sh)
        ${FPM_PASS}
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
        # When you are using symlinks to link the document root to the
        # current version of your application, you should pass the real
        # application path instead of the path to the symlink to PHP
        # FPM.
        # Otherwise, PHP's OPcache may not properly detect changes to
        # your PHP files (see https://github.com/zendtech/ZendOptimizerPlus/issues/126
        # for more information).
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 600;
        # Prevents URIs that include the front controller. This will 404:
        # http://domain.tld/index.php/some-path
        # Remove the internal directive to allow URIs like this
        internal;
    }

    # return 404 for all other php files not matching the front controller
    # this prevents access to other php files you don't want to be accessible.
    location ~ \.php$ {
      return 404;
    }
}
