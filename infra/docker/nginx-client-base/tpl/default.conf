# The container healthcheck polls /index.html?healthcheck every minute; keep it out
# of the access log so real traffic stays readable in `docker logs`.
map $request_uri $ps_loggable {
    ~*healthcheck  0;
    default        1;
}

server {
    server_tokens off;

    access_log /var/log/nginx/access.log combined if=$ps_loggable;

    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-src 'self' ${DASHBOARD_CLIENT_URL} ${KEYCLOAK_URL}; frame-ancestors 'self' ${ALLOWED_FRAME_ANCESTORS};";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    root /var/app;
    index index.html;

    location / {
        try_files $uri /index.html =404;
    }
}
