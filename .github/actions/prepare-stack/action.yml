name: 'Prepare the stack'
description: >-
  Steps shared by the CI jobs that run the stack: mkcert (optional), login to
  GHCR and to ECR Public, then the image pulls. Run it after actions/checkout.

inputs:
  github-token:
    description: 'Token to pull the images of this run from GHCR'
    required: true
  aws-access-key-id:
    description: 'AWS access key id (secret AWS_ECR_ACCESS_KEY_ID)'
    required: true
  aws-secret-access-key:
    description: 'AWS secret access key (secret AWS_ECR_ACCESS_KEY_SECRET)'
    required: true
  mkcert:
    description: 'Install mkcert and its local CA, for bin/dev/make-cert.sh'
    required: false
    default: 'false'
  pull:
    description: 'Pull the images of the services of COMPOSE_PROFILES, and of configurator'
    required: false
    default: 'true'
  services:
    description: 'Space-separated services to pull as well (pull must be true)'
    required: false
    default: ''

outputs:
  ecr-registry:
    description: 'The ECR Public registry logged in to'
    value: ${{ steps.login-ecr-public.outputs.registry }}

runs:
  using: composite
  steps:
    - name: Install mkcert
      if: inputs.mkcert == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install wget libnss3-tools
        wget https://github.com/FiloSottile/mkcert/releases/download/v1.4.3/mkcert-v1.4.3-linux-amd64
        sudo mv mkcert-v1.4.3-linux-amd64 /usr/bin/mkcert
        sudo chmod +x /usr/bin/mkcert
        mkcert -install

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    # The Keycloak and report-api images are not built here: they come from
    # public.ecr.aws, whose anonymous pulls hit its rate and data limits on
    # the shared GitHub runners. Logged in, the pulls are counted against the
    # AWS account.
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: us-east-1

    - name: Login to Amazon ECR Public
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Pull images
      if: inputs.pull == 'true'
      shell: bash
      env:
        SERVICES: ${{ inputs.services }}
      run: |
        docker compose pull
        # shellcheck disable=SC2086 # a list of services
        docker compose pull configurator ${SERVICES}
