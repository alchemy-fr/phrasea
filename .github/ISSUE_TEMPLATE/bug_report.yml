name: Bug report
description: Report something that does not work as expected
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report a bug.
              Do not report security vulnerabilities here: see the [security policy](https://github.com/alchemy-fr/phrasea/security/policy).
    - type: textarea
      id: description
      attributes:
          label: Description
          description: A clear and concise description of the bug.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. See error
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: Phrasea version
          description: Release tag (e.g. 4.5.1), or branch and commit when running from the sources.
      validations:
          required: true
    - type: dropdown
      id: component
      attributes:
          label: Component
          options:
              - Databox
              - Expose
              - Uploader
              - Dashboard
              - Configurator
              - Report
              - Other
      validations:
          required: true
    - type: dropdown
      id: deployment
      attributes:
          label: Deployment
          options:
              - Docker Compose
              - Kubernetes/Helm
              - Other
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs
          description: Container logs, browser console output or stack traces. They are formatted as code automatically.
          render: shell
