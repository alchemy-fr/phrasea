name: Feature request
description: Suggest an idea or an improvement
labels:
    - enhancement
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What problem would this feature solve? Who is affected?
          placeholder: I'm always frustrated when ...
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: Describe what you would like to happen.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Other solutions or workarounds you have considered.
    - type: dropdown
      id: component
      attributes:
          label: Component
          options:
              - Databox
              - Expose
              - Uploader
              - Dashboard
              - Configurator
              - Report
              - Other
      validations:
          required: true
