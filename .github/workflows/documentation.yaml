# Documentation of a work branch: builds only the images the documentation
# builder reads /srv/app/doc from and triggers
# alchemy-fr/phrasea-documentation-builder, which reads them from GHCR (the
# build cache, tagged with the commit sha). Nothing reaches the public
# registries (AWS ECR, Docker Hub): these images are not tested.
#
# Runs on a push whose commits contain "[documentation]", or on demand. next,
# master and release/** are left to ci.yaml, which triggers the builder once
# their images are tested and published.
# See doc/tech/Development/ci.md.
name: Documentation

on:
  push:
    branches-ignore:
      - next
      - master
      - 'release/**'
    tags-ignore: ['**']
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_php-fpm-base:
    name: 'Build php-fpm-base'
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[documentation]') || contains(toJson(github.event.commits), '[documentation]')"
    uses: ./.github/workflows/build_base.yaml
    with:
      image: php-fpm-base
      context: ./infra/docker/php-fpm-base
    secrets: inherit

  build_images:
    name: 'Build ${{ matrix.image }}'
    needs:
      - build_php-fpm-base
    strategy:
      matrix:
        include:
          - image: databox-api-php
            context: ./databox/api
            target: api-php
          - image: expose-api-php
            context: ./expose/api
            target: api-php
          - image: uploader-api-php
            context: ./uploader/api
            target: api-php
          - image: configurator
            context: ./configurator
            target: ''
    uses: ./.github/workflows/build.yaml
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      target: ${{ matrix.target }}
      withLibs: true
    secrets: inherit

  trigger_builder:
    name: 'Trigger the documentation builder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build_images
    steps:
      - name: Generate GitHub App token for documentation dispatch
        id: documentation-builder-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCUMENTATION_BUILDER_APP_ID }}
          private-key: ${{ secrets.DOCUMENTATION_BUILDER_APP_PRIVATE_KEY }}
          owner: alchemy-fr
          repositories: phrasea-documentation-builder

      - name: Trigger Workflow in documentation builder Repository
        run: |
            DATETIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            http_code=$(curl -sS -o /tmp/dispatch-response.json -w "%{http_code}" -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.documentation-builder-app-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/alchemy-fr/phrasea-documentation-builder/dispatches \
            -d "{\"event_type\": \"trigger-workflow\",\"client_payload\": {\"PHRASEA_REFNAME\": \"${{ github.ref_name }}\", \"PHRASEA_REFTYPE\": \"${{ github.ref_type }}\", \"PHRASEA_IMAGE_REGISTRY\": \"ghcr.io/${{ github.repository_owner }}\", \"PHRASEA_IMAGE_TAG\": \"${{ github.sha }}\", \"PHRASEA_DATETIME\": \"${DATETIME}\"}}")
            echo "repository_dispatch HTTP status: ${http_code}"
            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "repository_dispatch failed"
              cat /tmp/dispatch-response.json
              exit 1
            fi
