name: CI

on:
  push:
    branches:
      - next
      - master
      - 'release/**'
  pull_request:
    branches:
      - next
      - master
      - 'release/**'
  workflow_dispatch:
    inputs:
      documentation:
        description: 'Trigger the documentation builder (always done on next)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tier:
        description: 'standard or release'
        required: false
        default: standard
        type: string

# A master run pushes images: never cancel it. PR runs are superseded by the
# next push. The Release workflow owns its own group when it calls this one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: build
  PS_SUBNET: 172.34.0.0/16
  PS_GATEWAY_IP: 172.34.0.1
  PS_TRAEFIK_IP: 172.34.255.254
  TRUSTED_PROXIES: 172.34.255.254
  PHRASEA_DOMAIN: phrasea.local
  TRAEFIK_HTTPS_PORT: 4442
  TRAEFIK_HTTP_PORT: 8042
  HTTPS_PORT_PREFIX: ':4442'
  REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}/ps-
  DOCKER_TAG: ${{ github.sha }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  VERIFY_SSL: "false"
  COMPOSE_PROFILES: databox,expose,uploader,db,rabbitmq,redis,minio,report,mailpit,elasticsearch,dashboard,sockudo
  FIXTURES_GENERATE_IMAGES: "true"
  # The CI stack runs with APP_ENV=prod and the public default secrets of .env
  PHRASEA_ALLOW_DEFAULT_SECRETS: "1"
  # The S3 minimum part size, so that the e2e uploads span several parts
  S3_MULTIPART_MIN_CHUNK_SIZE: '5242880'
  # One PostgreSQL role per application (optional in production): the CI exercises it
  DATABOX_POSTGRES_USER: databox
  DATABOX_POSTGRES_PASSWORD: databox-ci
  EXPOSE_POSTGRES_USER: expose
  EXPOSE_POSTGRES_PASSWORD: expose-ci
  UPLOADER_POSTGRES_USER: uploader
  UPLOADER_POSTGRES_PASSWORD: uploader-ci
  KEYCLOAK_POSTGRES_USER: keycloak
  KEYCLOAK_POSTGRES_PASSWORD: keycloak-ci
  REPORT_POSTGRES_USER: report
  REPORT_POSTGRES_PASSWORD: report-ci
  # One MinIO user per consumer, restricted to its bucket (optional in production): the CI exercises it
  DATABOX_S3_ACCESS_KEY: databox
  DATABOX_S3_SECRET_KEY: databox-ci
  EXPOSE_S3_ACCESS_KEY: expose
  EXPOSE_S3_SECRET_KEY: expose-ci
  UPLOADER_S3_ACCESS_KEY: uploader
  UPLOADER_S3_SECRET_KEY: uploader-ci
  CONFIG_READER_S3_ACCESS_KEY: config-reader
  CONFIG_READER_S3_SECRET_KEY: config-reader-ci
  INDEXER_S3_ACCESS_KEY: indexer
  INDEXER_S3_SECRET_KEY: indexer-ci
  CYPRESS_CPU_LIMIT: '4'
  CYPRESS_MEMORY_LIMIT: '16G'

jobs:
  # docker-bake.hcl: each group builds and pushes its base images, then the
  # images built FROM them, on the same builder. Two groups on two runners, so
  # that the four Next.js builds do not share their runner with Composer.
  build:
    name: 'Build ${{ matrix.group }} images'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'alchemy-fr' }}
    strategy:
      matrix:
        group: [php, node]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 30

      - name: Generate git log
        if: matrix.group == 'node'
        run: bin/git-log.sh

      # The runner is discarded with the builder: no need to remove it.
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the base images
        uses: docker/bake-action@v7
        env:
          CACHE_TAG: build-cache-1
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.group }}-base
          push: true

      - name: Build and push
        uses: docker/bake-action@v7
        env:
          CACHE_TAG: build-cache-1
          SENTRY_RELEASE: ${{ github.sha }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.group }}
          push: true

  # The tests are split between parallel jobs, each on a runner of its own
  # with a stack of its own: the PHP suites (php-tests), the Cypress specs
  # (cypress) and, for the release tier, the heavy suites (release-checks).
  # The commit markers [skip test], [skip php-test] and [skip cypress] skip
  # them (see doc/tech/Development/ci.md).
  php-tests:
    name: 'PHP tests (${{ matrix.name }})'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - build
    if: ${{ !contains(github.event.head_commit.message || '', '[skip test]') && !contains(github.event.head_commit.message || '', '[skip php-test]') }}
    env:
      # The profiles bin/test.sh standard starts: nothing else is pulled.
      COMPOSE_PROFILES: db,redis,elasticsearch,minio,rabbitmq,report
    strategy:
      fail-fast: false
      matrix:
        include:
          # bin/test.sh standard <part>: together, the parts run all of it.
          - name: databox-functional-1
            part: 'databox-functional:1/2'
          - name: databox-functional-2
            part: 'databox-functional:2/2'
          - name: others
            part: others
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare the stack
        uses: ./.github/actions/prepare-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          services: databox-api-php expose-api-php uploader-api-php dockerize minio-setup

      - name: Test
        env:
          PART: ${{ matrix.part }}
        run: bin/test.sh standard "${PART}"

      - name: Extract error output
        if: failure()
        run: docker compose logs --no-color > docker-logs.log

      - name: Upload output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phrasea-output-php-${{ matrix.name }}
          path: ./docker-logs.log
          retention-days: 2

  cypress:
    name: 'Cypress (shard ${{ matrix.shard }}/${{ strategy.job-total }})'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - build
    if: ${{ !contains(github.event.head_commit.message || '', '[skip test]') && !contains(github.event.head_commit.message || '', '[skip cypress]') }}
    strategy:
      fail-fast: false
      matrix:
        # bin/dev/test-cypress.sh --shard <shard>/<number of shards>
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare the stack
        uses: ./.github/actions/prepare-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          mkcert: 'true'

      - name: Setup
        run: |
          docker compose down --volumes
          bin/dev/make-cert.sh
          sudo PHRASEA_DOMAIN="${PHRASEA_DOMAIN}" bin/dev/append-etc-hosts.sh
          bin/setup.sh test

      - name: Run Cypress tests
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bin/dev/test-cypress.sh --shard "${SHARD}"

      - name: Extract error output
        if: failure()
        run: |
          docker run -d --rm --name dummy -v "${COMPOSE_PROJECT_NAME}_cypress_output:/cypress/output" alpine:3.14.8 tail -f /dev/null
          rm -rf cypress-output
          docker cp dummy:/cypress/output ./cypress-output
          docker stop dummy
          docker compose logs --no-color > docker-logs.log

      - name: Upload output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phrasea-output-cypress-${{ matrix.shard }}
          path: |
            ./cypress-output/screenshots
            ./cypress-output/results
            ./docker-logs.log
          retention-days: 2

  release-checks:
    name: 'Release checks'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - build
    if: ${{ inputs.tier == 'release' && !contains(github.event.head_commit.message || '', '[skip test]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare the stack
        uses: ./.github/actions/prepare-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          mkcert: 'true'

      - name: Setup
        run: |
          docker compose down --volumes
          bin/dev/make-cert.sh
          sudo PHRASEA_DOMAIN="${PHRASEA_DOMAIN}" bin/dev/append-etc-hosts.sh
          bin/setup.sh test

      - name: Replay Doctrine migrations
        run: bin/dev/test-migrations.sh

      - name: Indexer end-to-end
        run: |
          docker compose --profile indexer pull databox-indexer
          # The indexer goes through the databox API: wait for it to be up.
          docker compose up -d --wait databox-api-php databox-api-nginx --wait-timeout 200
          bin/dev/test-indexer-e2e.sh --timeout 300

      - name: Extract error output
        if: failure()
        run: docker compose logs --no-color > docker-logs.log

      - name: Upload output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phrasea-output-release-checks
          path: ./docker-logs.log
          retention-days: 2

  # ECR Public only receives tested images: this job waits for every test job
  # and runs when none of them failed (or was cancelled, a timeout included).
  # A skipped test job (release-checks outside the release tier, the [skip …]
  # markers) does not hold it back.
  push-ecr:
    name: 'Push images to AWS ECR'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
      - php-tests
      - cypress
      - release-checks
    if: ${{ !cancelled() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR and ECR Public
        id: prepare
        uses: ./.github/actions/prepare-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          pull: 'false'

      - name: Compute image tag from ref
        env:
          # On a pull request, ref_name is "<number>/merge": tag with the source branch.
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          # A ref name is not necessarily a valid Docker tag: one must match
          # /[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}/, so "feat/x" is rejected.
          TAG=$(printf '%s' "$REF_NAME" | sed 's/[^A-Za-z0-9_.-]/-/g')
          case "$TAG" in
            [A-Za-z0-9_]*) ;;
            # A tag cannot start with "." or "-".
            *) TAG="_$(printf '%s' "$TAG" | cut -c2-)" ;;
          esac
          if [ ${#TAG} -gt 128 ]; then
            # Keep long refs distinct instead of collapsing them onto one tag.
            TAG="$(printf '%s' "$TAG" | cut -c1-120)-$(printf '%s' "$REF_NAME" | sha1sum | cut -c1-7)"
          fi
          echo "Ref \"$REF_NAME\" -> image tag \"$TAG\""
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Push images to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.prepare.outputs.ecr-registry }}
          REGISTRY_ALIAS: b2s9z7l1
        run: |
          # The images built by this run, configurator and databox-indexer included
          export COMPOSE_PROFILES="${COMPOSE_PROFILES},configurator,indexer"
          bin/ci-copy-images.sh "${ECR_REGISTRY}/${REGISTRY_ALIAS}/ps-" "${IMAGE_TAG}"

  # The documentation builder reads /srv/app/doc from the api-php and
  # configurator images of this run (GHCR, tagged with the commit sha), once
  # the tests have passed. Tags are left to release.yaml, which rebuilds every
  # released version.
  documentation_requested:
    name: 'Documentation requested?'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Look for next or the [documentation] marker
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSHED_MARKER: ${{ contains(toJson(github.event.commits), '[documentation]') }}
          DISPATCH_INPUT: ${{ inputs.documentation }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          run=false
          case "${EVENT}:${REF}" in
            *:refs/tags/*) ;;
            *:refs/heads/next) run=true ;;
            push:*) run=${PUSHED_MARKER} ;;
            workflow_dispatch:*) [ "${DISPATCH_INPUT}" = true ] && run=true ;;
            pull_request:*)
              # Not for a fork: no secret there, and the builder checks out
              # the head branch from this repository.
              if [ "${PR_HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] \
                && gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --jq '.[].commit.message' \
                  | grep -qF '[documentation]'; then
                run=true
              fi
              ;;
          esac
          echo "Documentation: ${run}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  documentation:
    name: 'Trigger the documentation builder'
    # Same condition as push-ecr: no test job failed or was cancelled.
    if: ${{ !cancelled() && needs.documentation_requested.outputs.run == 'true' && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - documentation_requested
      - build
      - php-tests
      - cypress
      - release-checks
    steps:
      - name: Generate GitHub App token for documentation dispatch
        id: documentation-builder-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCUMENTATION_BUILDER_APP_ID }}
          private-key: ${{ secrets.DOCUMENTATION_BUILDER_APP_PRIVATE_KEY }}
          owner: alchemy-fr
          repositories: phrasea-documentation-builder

      - name: Trigger Workflow in documentation builder Repository
        env:
          GH_TOKEN: ${{ steps.documentation-builder-app-token.outputs.token }}
          # The branch, also on a pull request (whose ref is refs/pull/N/merge)
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          jq -n \
            --arg branch "${BRANCH}" \
            --arg registry "${IMAGE_REGISTRY}" \
            --arg tag "${DOCKER_TAG}" \
            --arg datetime "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type: "trigger-workflow", client_payload: {
              PHRASEA_REFNAME: $branch,
              PHRASEA_REFTYPE: "branch",
              PHRASEA_IMAGE_REGISTRY: $registry,
              PHRASEA_IMAGE_TAG: $tag,
              PHRASEA_DATETIME: $datetime
            }}' \
            | gh api repos/alchemy-fr/phrasea-documentation-builder/dispatches --input -
