packages:
  - 'databox/client'
  - 'expose/client'
  - 'uploader/client'
  - 'dashboard/client'
  - 'lib/js/*'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  canvas: false
  core-js: false
  esbuild: false
  highlight.js: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@types/react@19.3.3'
