fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=CACHEZONE:10m inactive=60m max_size=40m;
# ProxyCachePurger rebuilds this key for each Origin and Accept it may take: any other value of these
# headers, or a query string, bypasses the cache, so that no variant escapes the purges.
# $ps_cache_uri is the normalized path of the original request ($uri becomes /index.php on the way to PHP).
fastcgi_cache_key "$http_origin:$http_accept:$request_method$ps_cache_uri";
# The key replaces the Vary header of the responses (Accept, Origin and the credentials, which bypass the
# cache): nginx would otherwise keep one variant per value of these headers, out of reach of the purges.
fastcgi_ignore_headers Vary;
add_header X-Cache-Status $upstream_cache_status;

# The responses differ by origin through the CORS headers: only the origin of the client is cached apart.
map $http_origin $ps_foreign_origin {
    default 1;
    ""      0;
${PS_CLIENT_ORIGIN_MAP_ENTRY}
}

# The Accept headers sent by the clients (the Expose client, the subtitles of its player), as listed in
# ProxyCachePurger::ACCEPT_HEADERS.
map $http_accept $ps_foreign_accept {
    default                                  1;
    "application/ld+json, application/json"  0;
    "application/json"                       0;
    "application/ld+json"                    0;
    "text/html"                              0;
    "*/*"                                    0;
}

map $args $ps_has_args {
    ""      0;
    default 1;
}

map $ps_cache_uri $ps_no_cache_uri {
    ""      1;
    default 0;
}

# The container healthcheck polls /favicon.ico?healthcheck every minute; keep it out
# of the access log so real traffic stays readable in `docker logs`.
map $request_uri $ps_loggable {
    ~*healthcheck  0;
    default        1;
}

# A request relayed by a reverse proxy comes from outside: only direct calls may purge.
map "$http_x_forwarded_for$http_forwarded$http_x_real_ip" $ps_proxied {
    ""      0;
    default 1;
}

server {
    root /srv/app/public;

    access_log /var/log/nginx/access.log combined if=$ps_loggable;

    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-src 'self' ${DASHBOARD_CLIENT_URL}; frame-ancestors 'self'";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    client_max_body_size $UPLOAD_MAX_FILE_SIZE;

    set $skip_cache 0;
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    location / {
        location ~* \.(eot|otf|svg|jpe?g|git|png|ttf|woff|woff2)$ {
            add_header Access-Control-Allow-Origin *;
            expires max;
        }

        set $ps_cache_uri $uri;

        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

	location ~ ^/purge(/.*) {
        if ($ps_proxied) {
            return 403;
        }
		fastcgi_cache_purge CACHEZONE "$http_origin:$http_accept:$request_method$1";
	}

    location ~ ^/index\.php(/|$) {
        #resolver 127.0.0.11;
        #set $upstream_host app;
        #fastcgi_pass $upstream_host:9000;
        # Uncomment the previous lines and comment the next one to enable dynamic resolution (incompatible with Kubernetes)
        fastcgi_pass expose-api-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # When you are using symlinks to link the document root to the
        # current version of your application, you should pass the real
        # application path instead of the path to the symlink to PHP
        # FPM.
        # Otherwise, PHP's OPcache may not properly detect changes to
        # your PHP files (see https://github.com/zendtech/ZendOptimizerPlus/issues/126
        # for more information).
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 600;

        fastcgi_cache CACHEZONE;
        fastcgi_cache_valid 10m;
        fastcgi_cache_methods GET;
        # The cache key ignores the credentials, and the purges target neither the query strings (signed
        # URLs included) nor the other origins and formats: such requests neither read nor fill the cache.
        fastcgi_cache_bypass $skip_cache $http_authorization $http_x_passwords $http_x_share_tokens $ps_has_args $ps_foreign_origin $ps_foreign_accept $ps_no_cache_uri;
        fastcgi_no_cache $skip_cache $http_authorization $http_x_passwords $http_x_share_tokens $ps_has_args $ps_foreign_origin $ps_foreign_accept $ps_no_cache_uri;

        # Prevents URIs that include the front controller. This will 404:
        # http://domain.tld/index.php/some-path
        # Remove the internal directive to allow URIs like this
        internal;
    }

    # return 404 for all other php files not matching the front controller
    # this prevents access to other php files you don't want to be accessible.
    location ~ \.php$ {
      return 404;
    }
}
