nelmio_cors:
    # The options of a path cannot unset a default one: they are all set on the paths below.
    paths:
        # The admin (session cookie) is never called cross-origin: no CORS header at all.
        '^/admin': ~
        # The clients authenticate with a bearer token, never with cookies: no credentials.
        '^/':
            allow_origin: ['*']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            allow_headers: ['Content-Type', 'Authorization', 'X-Passwords']
            expose_headers: ['Link']
            max_age: 3600
