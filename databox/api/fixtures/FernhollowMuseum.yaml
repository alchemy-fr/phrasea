# Permissions. Masks of alchemy/acl-bundle: VIEW 1, CREATE 2, EDIT 4, DELETE 8, OPERATOR 32,
# MASTER 64, OWNER 128, SHARE 256; CHILD_* = the same bit << 9 (CHILD_VIEW 512, CHILD_EDIT 2048,
# CHILD_DELETE 4096). Every persona is a member of the workspace (VIEW).
Alchemy\AclBundle\Entity\AccessControlEntry:
    fh_tpl_ace (template):
        userType: 0

    fh_ace_ws_{alice, bob, carol, dave} (extends fh_tpl_ace):
        userId: <keycloakUser($current)>
        objectType: workspace
        objectId: '@w_fernhollow->id'
        mask: 1
    # alice, curator: VIEW|EDIT|DELETE + CHILD_VIEW|CHILD_EDIT|CHILD_DELETE on Departments
    fh_ace_alice_departments (extends fh_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: collection
        objectId: '@fh_c_departments->id'
        mask: 6669
    # bob, researcher: VIEW + CHILD_VIEW on Departments (nothing on Conservation Lab)
    fh_ace_bob_departments (extends fh_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: collection
        objectId: '@fh_c_departments->id'
        mask: 513
    # carol, visitor: VIEW + CHILD_VIEW on Open Collection
    fh_ace_carol_open (extends fh_tpl_ace):
        userId: <keycloakUser("carol")>
        objectType: collection
        objectId: '@fh_c_open->id'
        mask: 513
    # dave, registrar: VIEW|EDIT + CHILD_VIEW|CHILD_EDIT on Outgoing Loans
    fh_ace_dave_loans (extends fh_tpl_ace):
        userId: <keycloakUser("dave")>
        objectType: collection
        objectId: '@fh_c_loans->id'
        mask: 2565
    # Restricted policies: VIEW (and EDIT) for the attributes, CHILD_VIEW (and CHILD_EDIT) for the renditions
    fh_ace_alice_curatorial (extends fh_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: attribute_policy
        objectId: '@fh_ap_curatorial->id'
        mask: 5
    fh_ace_dave_curatorial (extends fh_tpl_ace):
        userId: <keycloakUser("dave")>
        objectType: attribute_policy
        objectId: '@fh_ap_curatorial->id'
        mask: 1
    fh_ace_alice_archive (extends fh_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: rendition_policy
        objectId: '@fh_rp_archive->id'
        mask: 2560
    fh_ace_dave_archive (extends fh_tpl_ace):
        userId: <keycloakUser("dave")>
        objectType: rendition_policy
        objectId: '@fh_rp_archive->id'
        mask: 512

# bob and carol do not see the critically endangered species at all
App\Entity\Core\AttributeFilterRule:
    fh_afr_critically_endangered:
        workspace: '@w_fernhollow'
        condition: '<aqlAttributeIsNot("conservationstatus", @fh_cs_cr->id)>'
        __calls:
            - addTarget: [0, '<keycloakUser("bob")>']
            - addTarget: [0, '<keycloakUser("carol")>']

App\Entity\Core\AssetPolicy\AssetPolicy:
    fh_tpl_apol (template):
        workspace: '@w_fernhollow'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
    # Protects the location of the rare ferns (the condition matches the sub-collections too)
    fh_apol_rare_location (extends fh_tpl_apol):
        name: Rare species location
        conditions:
            - { field: collection, operator: '=', value: '@fh_c_rareferns->id' }
        actions:
            - { action: hide_attribute, definitionId: '@fh_ad_collectionsite->id' }
    # The archival masters of the loaned specimens are not handed over
    fh_apol_loans (extends fh_tpl_apol):
        name: Loans
        conditions:
            - { field: collection, operator: '=', value: '@fh_c_loans->id' }
        actions:
            - { action: hide_rendition, definitionId: '@fh_rd_archival->id' }

App\Entity\Core\AssetPolicy\AssetPolicyUser:
    fh_apu_rare_location_{bob, carol}:
        policy: '@fh_apol_rare_location'
        userType: 0
        userId: <keycloakUser($current)>
    fh_apu_loans_{dave}:
        policy: '@fh_apol_loans'
        userType: 0
        userId: <keycloakUser($current)>

App\Entity\Integration\WorkspaceIntegration:
    fh_tpl_wi (template):
        workspace: '@w_fernhollow'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        public: true

    # Rendition integration created by WorkspaceFactory
    fh_wi_rendition:
        __factory: { '@App\Fixture\WorkspaceFactory::getIntegration': ['@w_fernhollow', 'rendition'] }
    fh_wi_blurhash (extends fh_tpl_wi):
        integration: blurhash
        config:
            rendition: Thumbnail
        needs:
            - '@fh_wi_rendition'
    fh_wi_watermark (extends fh_tpl_wi):
        integration: core.watermark
        config:
            attributeName: creditline
            applyToRenditions:
                - Preview
            fontSize: 18
            color: '#FFFFFF'
            position:
                top: 92%
                left: 50%
        needs:
            - '@fh_wi_rendition'
    fh_wi_rekognition (extends fh_tpl_wi):
        integration: aws.rekognition
        enabled: false
        config:
            region: eu-west-1
            labels:
                enabled: true
                attributes:
                    - { name: keywords, threshold: 0.8 }

App\Entity\Integration\WorkspaceSecret:
    fh_secret_{AWS_ACCESS_KEY_ID, AWS_ACCESS_KEY_SECRET}:
        workspace: '@w_fernhollow'
        name: <current()>
        plainValue: xxx


