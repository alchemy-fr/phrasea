# Collections (privacy). A collection is at least as visible as its parent: the branches that
# hide their assets from the members (0 and 1) are under parents of privacy 0 or 1.
# Departments (1)
#   Botany (1)
#     Herbarium (1)
#       Ferns (1)
#         Rare Ferns (0, alice)
#   Entomology (1, alice)
#     Lepidoptera (2, alice)
#     Coleoptera (0, alice)
#   Ornithology (5)
#   Geology (1, bob)
#     Minerals (4, bob)
# Exhibitions (5)
#   Wild Coasts (2025) (5)
#   Under the Canopy (2026) (5)
# Conservation Lab (0)
# Outgoing Loans (1)
# Open Collection (5)
App\Entity\Core\Collection:
    fh_tpl_c (template):
        workspace: '@w_fernhollow'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        privacy: 1

    fh_c_departments (extends fh_tpl_c):
        name: Departments
        translations: { name: { fr: Départements } }
    fh_c_botany (extends fh_tpl_c):
        parent: '@fh_c_departments'
        name: Botany
        translations: { name: { fr: Botanique } }
    fh_c_herbarium (extends fh_tpl_c):
        parent: '@fh_c_botany'
        name: Herbarium
        translations: { name: { fr: Herbier } }
    fh_c_ferns (extends fh_tpl_c):
        parent: '@fh_c_herbarium'
        name: Ferns
        translations: { name: { fr: Fougères } }
    fh_c_rareferns (extends fh_tpl_c):
        parent: '@fh_c_ferns'
        name: Rare Ferns
        ownerId: <keycloakUser("alice")>
        privacy: 0
        translations: { name: { fr: Fougères rares } }
    fh_c_entomology (extends fh_tpl_c):
        parent: '@fh_c_departments'
        name: Entomology
        ownerId: <keycloakUser("alice")>
        translations: { name: { fr: Entomologie } }
    fh_c_lepidoptera (extends fh_tpl_c):
        parent: '@fh_c_entomology'
        name: Lepidoptera
        ownerId: <keycloakUser("alice")>
        privacy: 2
        translations: { name: { fr: Lépidoptères } }
    fh_c_coleoptera (extends fh_tpl_c):
        parent: '@fh_c_entomology'
        name: Coleoptera
        ownerId: <keycloakUser("alice")>
        privacy: 0
        translations: { name: { fr: Coléoptères } }
    fh_c_ornithology (extends fh_tpl_c):
        parent: '@fh_c_departments'
        name: Ornithology
        privacy: 5
        translations: { name: { fr: Ornithologie } }
    fh_c_geology (extends fh_tpl_c):
        parent: '@fh_c_departments'
        name: Geology
        ownerId: <keycloakUser("bob")>
        translations: { name: { fr: Géologie } }
    fh_c_minerals (extends fh_tpl_c):
        parent: '@fh_c_geology'
        name: Minerals
        ownerId: <keycloakUser("bob")>
        privacy: 4
        translations: { name: { fr: Minéraux } }
    fh_c_exhibitions (extends fh_tpl_c):
        name: Exhibitions
        privacy: 5
        translations: { name: { fr: Expositions } }
    fh_c_wildcoasts (extends fh_tpl_c):
        parent: '@fh_c_exhibitions'
        name: Wild Coasts (2025)
        privacy: 5
        translations: { name: { fr: Côtes sauvages (2025) } }
    fh_c_canopy (extends fh_tpl_c):
        parent: '@fh_c_exhibitions'
        name: Under the Canopy (2026)
        privacy: 5
        translations: { name: { fr: Sous la canopée (2026) } }
    fh_c_lab (extends fh_tpl_c):
        name: Conservation Lab
        privacy: 0
        translations: { name: { fr: Laboratoire de conservation } }
    fh_c_loans (extends fh_tpl_c):
        name: Outgoing Loans
        translations: { name: { fr: Prêts sortants } }
    fh_c_open (extends fh_tpl_c):
        name: Open Collection
        privacy: 5
        translations: { name: { fr: Collection ouverte } }

    # Collections of the "Specimen record" stories
    fh_sc{1..6} (extends fh_tpl_c):
        name: null

# Assets: images of the specimens (fh_a_v_s*, geolocated) and of the views of the "Specimen
# record" stories (fh_a_v_r*), documents and media (fh_a_d_*).
# Images are numbered across the workspace (specimens 1-46, views 47-64): the number is the
# lock of imageUrlRandomRatio(), and it links an asset to its files and renditions.
App\Entity\Core\Asset:
    fh_tpl_a (template):
        workspace: '@w_fernhollow'
        ownerId: <keycloakUser("alice")>
        # Secret or private in the workspace: the collections decide who sees them
        privacy: '<numberBetween(0, 1)>'
        __calls:
            - addTag (50%?): ['@fh_tag_instorage']
            - addTag (15%?): ['@fh_tag_digitise']
            - addTag (15%?): ['@fh_tag_fragile']

    # Specimens, from the top of the tree down to Rare Ferns, then the side collections
    fh_a_v_s{1..3} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        __calls:
            - addToCollection: ['@fh_c_botany', true, true]
    fh_a_v_s{4..8} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        __calls:
            - addToCollection: ['@fh_c_herbarium', true, true]
            - addToCollection (40%?): ['@fh_c_canopy', true]
    fh_a_v_s{9..11} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        privacy: 5
        __calls:
            - addToCollection: ['@fh_c_open', true, true]
            - addTag: ['@fh_tag_ondisplay']
    fh_a_v_s{12..17} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        __calls:
            - addToCollection: ['@fh_c_ferns', true, true]
            - addToCollection (40%?): ['@fh_c_canopy', true]
    # 18-19: critically endangered, 20-21: endangered (see their conservation status)
    fh_a_v_s{18..21} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        privacy: 0
        __calls:
            - addToCollection: ['@fh_c_rareferns', true, true]
            - addTag: ['@fh_tag_fragile']
    fh_a_v_s{22..27} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        ownerId: <keycloakUser("bob")>
        __calls:
            - addToCollection: ['@fh_c_lepidoptera', true, true]
            - addToCollection (40%?): ['@fh_c_canopy', true]
    fh_a_v_s{28..30} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        privacy: 0
        __calls:
            - addToCollection: ['@fh_c_lab', true, true]
    fh_a_v_s{31..34} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        ownerId: <keycloakUser("bob")>
        __calls:
            - addToCollection: ['@fh_c_coleoptera', true, true]
    fh_a_v_s{35..39} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        __calls:
            - addToCollection: ['@fh_c_ornithology', true, true]
            - addToCollection (40%?): ['@fh_c_wildcoasts', true]
    fh_a_v_s{40..42} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        privacy: 1
        __calls:
            - addToCollection: ['@fh_c_loans', true, true]
            - addTag: ['@fh_tag_onloan']
    fh_a_v_s{43..46} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        ownerId: <keycloakUser("bob")>
        __calls:
            - addToCollection: ['@fh_c_minerals', true, true]
            - addToCollection (40%?): ['@fh_c_wildcoasts', true]

    # "Specimen record" stories, with the front, back and label views of the specimen
    fh_story{1..6} (extends fh_tpl_a):
        storyCollection: '@fh_sc<current()>'
        __calls:
            - addToCollection: ['@fh_c_entomology', true, true]
    fh_a_v_r{47..52} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        __calls:
            - addToCollection: ['@fh_c_entomology', true, true]
            - addToCollection: ['@fh_sc<($current - 46)>', true]
    fh_a_v_r{53..58} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        __calls:
            - addToCollection: ['@fh_c_entomology', true, true]
            - addToCollection: ['@fh_sc<($current - 52)>', true]
    fh_a_v_r{59..64} (extends fh_tpl_a):
        source: '@fh_f_m<current()>'
        __calls:
            - addToCollection: ['@fh_c_entomology', true, true]
            - addToCollection: ['@fh_sc<($current - 58)>', true]

    # Documents and media
    fh_a_d_accession{1..8} (extends fh_tpl_a):
        source: '@fh_f_accession<current()>'
        ownerId: <keycloakUser("dave")>
        __calls:
            - addToCollection: ['@fh_c_departments', true, true]
    fh_a_d_notebook{1..7} (extends fh_tpl_a):
        source: '@fh_f_notebook<current()>'
        ownerId: <keycloakUser("carol")>
        __calls:
            - addToCollection: ['@fh_c_geology', true, true]
    fh_a_d_audioguide{1..3} (extends fh_tpl_a):
        source: '@fh_f_audioguide<current()>'
        privacy: 5
        __calls:
            - addToCollection: ['@fh_c_wildcoasts', true, true]
    fh_a_d_audioguide{4..6} (extends fh_tpl_a):
        source: '@fh_f_audioguide<current()>'
        privacy: 3
        __calls:
            - addToCollection: ['@fh_c_canopy', true, true]
    fh_a_d_video{1..2} (extends fh_tpl_a):
        source: '@fh_f_video_m<current()>'
        privacy: 5
        __calls:
            - addToCollection: ['@fh_c_exhibitions', true, true]
    fh_a_d_video{3..4} (extends fh_tpl_a):
        source: '@fh_f_video_m<current()>'
        privacy: 0
        __calls:
            - addToCollection: ['@fh_c_lab', true, true]

App\Entity\Core\File:
    fh_tpl_file (template):
        workspace: '@w_fernhollow'
        storage: s3_main
        pathPublic: '95%? true : false'
        __calls:
            - setNoAnalysisNeeded: []
    fh_tpl_jpg (template, extends fh_tpl_file):
        type: image/jpeg
        extension: jpg
    fh_tpl_pdf (template, extends fh_tpl_file):
        type: application/pdf
        extension: pdf
    fh_tpl_mp3 (template, extends fh_tpl_file):
        type: audio/mp3
        extension: mp3
    fh_tpl_mp4 (template, extends fh_tpl_file):
        type: video/mp4
        extension: mp4

    # m = source and main rendition (1000px), p = preview (500px), t = thumbnail (200px),
    # a = archival master (2000px)
    fh_f_m{1..64} (extends fh_tpl_jpg): { path: '<imageUrlRandomRatio(@w_fernhollow->id, <current()>, 1000, "museum")>' }
    fh_f_p{1..64} (extends fh_tpl_jpg): { path: '<imageUrlRandomRatio(@w_fernhollow->id, <current()>, 500, "museum")>' }
    fh_f_t{1..64} (extends fh_tpl_jpg): { path: '<imageUrlRandomRatio(@w_fernhollow->id, <current()>, 200, "museum")>' }
    fh_f_a{40..42} (extends fh_tpl_jpg): { path: '<imageUrlRandomRatio(@w_fernhollow->id, <current()>, 2000, "museum")>' }

    fh_f_accession{1..8} (extends fh_tpl_pdf): { path: '<randomMedia(@w_fernhollow->id, "pdf", <current()>, "fernhollow-museum/accession-record")>' }
    fh_f_notebook{1..7} (extends fh_tpl_pdf): { path: '<randomMedia(@w_fernhollow->id, "pdf", <current()>, "fernhollow-museum/field-notebook")>' }
    fh_f_audioguide{1..6} (extends fh_tpl_mp3): { path: '<randomMedia(@w_fernhollow->id, "mp3", <current()>, "fernhollow-museum/audio-guide")>' }
    fh_f_video_m{1..4} (extends fh_tpl_mp4): { path: '<randomMedia(@w_fernhollow->id, "mp4", <current()>, "fernhollow-museum/video")>' }
    fh_f_video_t{1..4} (extends fh_tpl_mp4): { path: '<randomMedia(@w_fernhollow->id, "mp4", <current()>, "fernhollow-museum/video")>' }

App\Entity\Core\AssetRendition:
    fh_ar_s_m{1..46}: { definition: '@fh_rd_main', asset: '@fh_a_v_s<current()>', file: '@fh_a_v_s<current()>->source' }
    fh_ar_s_p{1..46}: { definition: '@fh_rd_preview', asset: '@fh_a_v_s<current()>', file: '@fh_f_p<current()>' }
    fh_ar_s_t{1..46}: { definition: '@fh_rd_thumbnail', asset: '@fh_a_v_s<current()>', file: '@fh_f_t<current()>' }
    fh_ar_s_a{40..42}: { definition: '@fh_rd_archival', asset: '@fh_a_v_s<current()>', file: '@fh_f_a<current()>' }
    fh_ar_r_m{47..64}: { definition: '@fh_rd_main', asset: '@fh_a_v_r<current()>', file: '@fh_a_v_r<current()>->source' }
