# Fernhollow Natural History Museum: heritage inventory (specimens, field notebooks, loans).
# Also the test bench of the permissions: a collection tree of 5 levels, privacies 0 to 5
# mixed on the branches, collections owned by different users, assets at every level.
# Personas: alice = curator, bob = researcher, carol = visitor, dave = registrar.
# See doc/tech/Databox/fixtures.md

App\Entity\Core\Workspace:
    w_fernhollow:
        __factory: { '@App\Fixture\WorkspaceFactory::create': ['<keycloakUser("phrasea-admin", ["phrasea-admin"])>'] }
        name: Fernhollow Natural History Museum
        slug: fernhollow-museum
        enabledLocales: [en, fr]
        attachTermsToExports: true
        translations:
            name:
                fr: Muséum d'histoire naturelle de Fernhollow

App\Entity\Core\TermsVersion:
    fh_terms:
        workspace: '@w_fernhollow'
        version: 1
        text: |
            Fernhollow image licence terms

            Images of the Fernhollow Natural History Museum collections are provided for study,
            teaching and non-commercial publication only. Credit every reproduction with
            "© Fernhollow Natural History Museum" and the inventory number of the specimen.
            Any commercial use requires a written agreement with the museum.
        translations:
            text:
                fr: |
                    Conditions de licence des images de Fernhollow

                    Les images des collections du Muséum d'histoire naturelle de Fernhollow sont
                    fournies pour l'étude, l'enseignement et la publication non commerciale
                    uniquement. Toute reproduction doit porter la mention
                    « © Fernhollow Natural History Museum » et le numéro d'inventaire du spécimen.
                    Tout usage commercial requiert un accord écrit du muséum.

App\Entity\Core\AttributePolicy:
    # "Public" policy created by WorkspaceFactory
    fh_ap_public:
        __factory: { '@App\Fixture\WorkspaceFactory::getAttributePolicy': ['@w_fernhollow'] }
    fh_ap_curatorial:
