# Hollowtone Recording: recording studio. Music productions (albums, music videos), recording
# sessions, voice-overs and jingles for clients, masters reserved to the label. It holds all the
# audio and the video of the fixtures.
# Personas: alice = studio manager, bob = sound engineer, carol = client (a label),
# dave = archivist.
# See doc/tech/Databox/fixtures.md

App\Entity\Core\Workspace:
    w_hollowtone:
        __factory: { '@App\Fixture\WorkspaceFactory::create': ['<keycloakUser("phrasea-admin", ["phrasea-admin"])>'] }
        name: Hollowtone Recording
        slug: hollowtone-recording
        enabledLocales: [en, fr]
        translations:
            name:
                fr: Studios d'enregistrement Hollowtone

App\Entity\Core\AttributePolicy:
    # "Public" policy created by WorkspaceFactory
    ht_ap_public:
        __factory: { '@App\Fixture\WorkspaceFactory::getAttributePolicy': ['@w_hollowtone'] }
    ht_ap_label:
        workspace: '@w_hollowtone'
        name: Label
        public: false
        editable: false

App\Entity\Core\RenditionPolicy:
    # "Public" policy created by WorkspaceFactory
    ht_rp_public:
        __factory: { '@App\Fixture\WorkspaceFactory::getRenditionPolicy': ['@w_hollowtone'] }
    ht_rp_masters:
        workspace: '@w_hollowtone'
        name: Masters
        public: false
        editable: false

App\Entity\Core\RenditionDefinition:
    # Definitions created by WorkspaceFactory
    ht_rd_{main, preview, thumbnail, animatedThumbnail}:
        __factory: { '@App\Fixture\WorkspaceFactory::getRenditionDefinition': ['@w_hollowtone', '<current()>'] }
    ht_rd_master:
        workspace: '@w_hollowtone'
        name: Master
        policy: '@ht_rp_masters'
        parent: '@ht_rd_main'
        buildMode: 1
        translations: { name: { fr: Master } }

App\Entity\Core\EntityList:
    ht_el_genre:
        workspace: '@w_hollowtone'
        name: Genre
        withTranslations: true
    ht_el_instrument:
        workspace: '@w_hollowtone'
