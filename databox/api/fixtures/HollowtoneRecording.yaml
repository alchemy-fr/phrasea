# Permissions. Masks of alchemy/acl-bundle: VIEW 1, CREATE 2, EDIT 4, DELETE 8, OPERATOR 32,
# MASTER 64, OWNER 128, SHARE 256; CHILD_* = the same bit << 9 (CHILD_VIEW 512, CHILD_CREATE 1024,
# CHILD_EDIT 2048, CHILD_OPERATOR 16384). Every persona is a member of the workspace (VIEW).
Alchemy\AclBundle\Entity\AccessControlEntry:
    ht_tpl_ace (template):
        userType: 0

    # alice, studio manager: VIEW|EDIT|OPERATOR + CHILD_VIEW|CHILD_EDIT|CHILD_OPERATOR on the workspace
    ht_ace_ws_alice (extends ht_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: workspace
        objectId: '@w_hollowtone->id'
        mask: 18981
    ht_ace_ws_{bob, carol, dave} (extends ht_tpl_ace):
        userId: <keycloakUser($current)>
        objectType: workspace
        objectId: '@w_hollowtone->id'
        mask: 1
    # bob, sound engineer: VIEW|CREATE|EDIT + CHILD_VIEW|CHILD_CREATE|CHILD_EDIT on Sessions
    ht_ace_bob_sessions (extends ht_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: collection
        objectId: '@ht_c_sessions->id'
        mask: 3591
    # carol, client (a label): VIEW + CHILD_VIEW on Client work and on Albums
    ht_ace_carol_{clientwork, albums} (extends ht_tpl_ace):
        userId: <keycloakUser("carol")>
        objectType: collection
        objectId: '@ht_c_<current()>->id'
        mask: 513
    # dave, archivist: VIEW|EDIT + CHILD_VIEW|CHILD_EDIT on Vault
    ht_ace_dave_vault (extends ht_tpl_ace):
        userId: <keycloakUser("dave")>
        objectType: collection
        objectId: '@ht_c_vault->id'
        mask: 2565
    # Restricted policies: VIEW (and EDIT) for the attributes, CHILD_VIEW (and CHILD_EDIT) for the renditions
    ht_ace_alice_label (extends ht_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: attribute_policy
        objectId: '@ht_ap_label->id'
        mask: 5
    ht_ace_bob_label (extends ht_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: attribute_policy
        objectId: '@ht_ap_label->id'
        mask: 1
    ht_ace_alice_masters (extends ht_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: rendition_policy
        objectId: '@ht_rp_masters->id'
        mask: 2560
    ht_ace_bob_masters (extends ht_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: rendition_policy
        objectId: '@ht_rp_masters->id'
        mask: 512

# carol does not see the assets that must not be distributed
App\Entity\Core\AttributeFilterRule:
    ht_afr_donotdistribute:
        workspace: '@w_hollowtone'
        condition: '<aqlTagIsNot(@ht_tag_donotdistribute->id)>'
        __calls:
            - addTarget: [0, '<keycloakUser("carol")>']

App\Entity\Core\AssetPolicy\AssetPolicy:
    ht_apol_unreleased:
        workspace: '@w_hollowtone'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        name: Unreleased masking
        conditions:
            - { field: collection, operator: '=', value: '@ht_c_albums->id' }
        actions:
            - { action: hide_rendition, definitionId: '@ht_rd_master->id' }
            - { action: hide_attribute, definitionId: '@ht_ad_contractnotes->id' }

App\Entity\Core\AssetPolicy\AssetPolicyUser:
    ht_apu_unreleased_{carol, dave}:
        policy: '@ht_apol_unreleased'
        userType: 0
        userId: <keycloakUser($current)>

App\Entity\Integration\WorkspaceIntegration:
    ht_tpl_wi (template):
        workspace: '@w_hollowtone'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        public: true

    # Rendition integration created by WorkspaceFactory
    ht_wi_rendition:
        __factory: { '@App\Fixture\WorkspaceFactory::getIntegration': ['@w_hollowtone', 'rendition'] }
    ht_wi_blurhash (extends ht_tpl_wi):
        integration: blurhash
        config:
            rendition: '@ht_rd_thumbnail->id'
        needs:
            - '@ht_wi_rendition'
    ht_wi_similarity (extends ht_tpl_wi):
        integration: core.similarity
        config:
            rendition: '@ht_rd_preview->id'
        needs:
            - '@ht_wi_rendition'
    ht_wi_face_recognition (extends ht_tpl_wi):
        integration: core.face_recognition
        config:
            attribute: people
            rendition: '@ht_rd_preview->id'
            processIncoming: true
        needs:
            - '@ht_wi_rendition'
    ht_wi_transcribe (extends ht_tpl_wi):
        integration: aws.transcribe
        enabled: false
        config:
            region: eu-west-1
            workloadS3Bucket: hollowtone-transcribe-workload
            attributes:
                vtt: webvtttranscript

App\Entity\Integration\WorkspaceSecret:
    ht_secret_{AWS_ACCESS_KEY_ID, AWS_ACCESS_KEY_SECRET}:
        workspace: '@w_hollowtone'
        name: <current()>
        plainValue: xxx
