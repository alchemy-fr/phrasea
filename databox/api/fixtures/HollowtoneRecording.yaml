# Collections (privacy):
# Productions (1)
#   Music (1)
#     Albums (1)
#     Music videos (2)
#   Client work (1, alice)
#     Voice-overs & jingles (2, alice)
# Sessions (1) > 2025, 2026 (1)
# Vault (0)
# Press (5)
App\Entity\Core\Collection:
    ht_tpl_c (template):
        workspace: '@w_hollowtone'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        privacy: 1

    ht_c_productions (extends ht_tpl_c):
        name: Productions
    ht_c_music (extends ht_tpl_c):
        parent: '@ht_c_productions'
        name: Music
        translations: { name: { fr: Musique } }
    ht_c_albums (extends ht_tpl_c):
        parent: '@ht_c_music'
        name: Albums
    ht_c_musicvideos (extends ht_tpl_c):
        parent: '@ht_c_music'
        name: Music videos
        privacy: 2
        translations: { name: { fr: Clips } }
    ht_c_clientwork (extends ht_tpl_c):
        parent: '@ht_c_productions'
        name: Client work
        ownerId: <keycloakUser("alice")>
        translations: { name: { fr: Travaux pour les clients } }
    ht_c_voiceovers (extends ht_tpl_c):
        parent: '@ht_c_clientwork'
        name: Voice-overs & jingles
        ownerId: <keycloakUser("alice")>
        privacy: 2
        translations: { name: { fr: Voix off et jingles } }
    ht_c_sessions (extends ht_tpl_c):
        name: Sessions
    ht_c_sessions_{2025, 2026} (extends ht_tpl_c):
        parent: '@ht_c_sessions'
        name: '<current()>'
    ht_c_vault (extends ht_tpl_c):
        name: Vault
        privacy: 0
        translations: { name: { fr: Coffre } }
    ht_c_press (extends ht_tpl_c):
        name: Press
        privacy: 5
        translations: { name: { fr: Presse } }

    # Collections of the stories: "Album" (1-4) and "Session" (5-8)
    ht_sc{1..8} (extends ht_tpl_c):
        name: null

# Assets: images (ht_a_i_*: album covers, session photos), audio (ht_a_a_*: tracks, takes,
# voice-overs), video (ht_a_v_*: music videos, session footage, behind the scenes) and the
# stories: an "Album" (ht_album<n>) holds its cover and its 4 tracks, a "Session"
# (ht_session<n>) its photo, a session footage and 2 takes.
# Images are numbered across the workspace (covers 1-4, session photos 5-24): the number is the
# lock of imageUrlRandomRatio(), and it links an asset to its source file. The media are
# numbered in their set.
App\Entity\Core\Asset:
    ht_tpl_a (template):
        workspace: '@w_hollowtone'
        ownerId: <keycloakUser("bob")>
        privacy: 1

    # Recordings (audio and video), at a step of their production
    ht_tpl_rec (template, extends ht_tpl_a):
        __calls:
            - addTag (30%?): ['@ht_tag_roughmix']
            - addTag (30%?): ['@ht_tag_finalmix']
            - addTag (25%?): ['@ht_tag_mastered']
            - addTag (20%?): ['@ht_tag_approved']
            - addTag (10%?): ['@ht_tag_donotdistribute']

    # Album covers, also in the press kit
    ht_a_i_cover{1..4} (extends ht_tpl_a):
        source: '@ht_f_m<current()>'
        ownerId: <keycloakUser("alice")>
        __calls:
            - addToCollection: ['@ht_c_albums', true, true]
            - addToCollection: ['@ht_sc<current()>', true]
            - addToCollection: ['@ht_c_press', true]
    # Session photos: 5-8 are the covers of the "Session" stories
    ht_a_i_session{5..8} (extends ht_tpl_a):
        source: '@ht_f_m<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2026', true, true]
            - addToCollection: ['@ht_sc<current()>', true]
    ht_a_i_session{9..16} (extends ht_tpl_a):
        source: '@ht_f_m<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2025', true, true]
            - addToCollection (20%?): ['@ht_c_press', true]
            - addTag (10%?): ['@ht_tag_donotdistribute']
    ht_a_i_session{17..24} (extends ht_tpl_a):
        source: '@ht_f_m<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2026', true, true]
            - addToCollection (20%?): ['@ht_c_press', true]
            - addTag (10%?): ['@ht_tag_donotdistribute']

    # Four tracks on each album
    ht_a_a_track{1..4} (extends ht_tpl_rec):
        source: '@ht_f_track<current()>'
        __calls:
            - addToCollection: ['@ht_c_albums', true, true]
            - addToCollection: ['@ht_sc1', true]
    ht_a_a_track{5..8} (extends ht_tpl_rec):
        source: '@ht_f_track<current()>'
        __calls:
            - addToCollection: ['@ht_c_albums', true, true]
            - addToCollection: ['@ht_sc2', true]
    ht_a_a_track{9..12} (extends ht_tpl_rec):
        source: '@ht_f_track<current()>'
        __calls:
            - addToCollection: ['@ht_c_albums', true, true]
            - addToCollection: ['@ht_sc3', true]
    ht_a_a_track{13..16} (extends ht_tpl_rec):
        source: '@ht_f_track<current()>'
        __calls:
            - addToCollection: ['@ht_c_albums', true, true]
            - addToCollection: ['@ht_sc4', true]
    # Isolated takes of an instrument or a voice, two in each "Session" story
    ht_a_a_take{1..4} (extends ht_tpl_rec):
        source: '@ht_f_take<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2026', true, true]
            - addToCollection: ['@ht_sc<($current + 4)>', true]
    ht_a_a_take{5..8} (extends ht_tpl_rec):
        source: '@ht_f_take<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2026', true, true]
            - addToCollection: ['@ht_sc<current()>', true]
    # Voice-overs and jingles for the clients
    ht_a_a_voiceover{1..6} (extends ht_tpl_rec):
        source: '@ht_f_voiceover<current()>'
        ownerId: <keycloakUser("alice")>
        __calls:
            - addToCollection: ['@ht_c_voiceovers', true, true]

    ht_a_v_clip{1..6} (extends ht_tpl_rec):
        source: '@ht_f_clip<current()>'
        ownerId: <keycloakUser("alice")>
        __calls:
            - addToCollection: ['@ht_c_musicvideos', true, true]
    # Session footage: 1-4 are in the "Session" stories
    ht_a_v_footage{1..4} (extends ht_tpl_rec):
        source: '@ht_f_footage<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2026', true, true]
            - addToCollection: ['@ht_sc<($current + 4)>', true]
    ht_a_v_footage{5..8} (extends ht_tpl_rec):
        source: '@ht_f_footage<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2025', true, true]
    ht_a_v_bts{1..4} (extends ht_tpl_a):
        source: '@ht_f_bts<current()>'
        ownerId: <keycloakUser("dave")>
        privacy: 0
        __calls:
            - addToCollection: ['@ht_c_vault', true, true]

    # The cover of a story is its first item: the story shares its source file (see StoryCoverManager)
    # "Album" stories, with the album cover
    ht_album{1..4} (extends ht_tpl_a):
        source: '@ht_f_m<current()>'
        ownerId: <keycloakUser("alice")>
        storyCollection: '@ht_sc<current()>'
        __calls:
            - addToCollection: ['@ht_c_albums', true, true]
    # "Session" stories, with the session photo
    ht_session{5..8} (extends ht_tpl_a):
        source: '@ht_f_m<current()>'
        storyCollection: '@ht_sc<current()>'
        __calls:
            - addToCollection: ['@ht_c_sessions_2026', true, true]

App\Entity\Core\File:
    ht_tpl_file (template):
        workspace: '@w_hollowtone'
        storage: s3_main
        pathPublic: '95%? true : false'
        __calls:
            - setNoAnalysisNeeded: []
    ht_tpl_jpg (template, extends ht_tpl_file):
        type: image/jpeg
        extension: jpg
    ht_tpl_mp3 (template, extends ht_tpl_file):
        type: audio/mp3
        extension: mp3
    ht_tpl_mp4 (template, extends ht_tpl_file):
        type: video/mp4
        extension: mp4

    # Source files only (m = image source, 1000px, with a large metadata set): the renditions
    # are built by the ingest workflow run after the load
    ht_f_m{1..24} (extends ht_tpl_jpg): { path: '<imageUrlRandomRatio(@w_hollowtone->id, <current()>, 1000, "studio")>', metadata: '<largeJSONFileMetadata()>' }

    ht_f_track{1..16} (extends ht_tpl_mp3): { path: '<randomMedia(@w_hollowtone->id, "mp3", <current()>, "hollowtone-recording/track")>', metadata: '<largeJSONFileMetadata()>' }
    ht_f_take{1..8} (extends ht_tpl_mp3): { path: '<randomMedia(@w_hollowtone->id, "mp3", <current()>, "hollowtone-recording/take")>', metadata: '<largeJSONFileMetadata()>' }
    ht_f_voiceover{1..6} (extends ht_tpl_mp3): { path: '<randomMedia(@w_hollowtone->id, "mp3", <current()>, "hollowtone-recording/voice-over")>', metadata: '<largeJSONFileMetadata()>' }
    ht_f_clip{1..6} (extends ht_tpl_mp4): { path: '<randomMedia(@w_hollowtone->id, "mp4", <current()>, "hollowtone-recording/music-video")>', metadata: '<largeJSONFileMetadata()>' }
    ht_f_footage{1..8} (extends ht_tpl_mp4): { path: '<randomMedia(@w_hollowtone->id, "mp4", <current()>, "hollowtone-recording/session-footage")>', metadata: '<largeJSONFileMetadata()>' }
    ht_f_bts{1..4} (extends ht_tpl_mp4): { path: '<randomMedia(@w_hollowtone->id, "mp4", <current()>, "hollowtone-recording/behind-the-scenes")>', metadata: '<largeJSONFileMetadata()>' }

App\Entity\Core\Attribute:
    ht_tpl_at (template):
        origin: 0

    # Titles. The titles of the albums, tracks, sessions, clips and voice-overs follow the
    # number of the fixture (see ThematicFaker::studioTitle()).
    ht_at_title_cover{1..4} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_i_cover<current()>', value: '<studioTitle("album", <current()>)> – front cover' }
    ht_at_title_photo{5..24} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_i_session<current()>', value: 'Session photo #<current()>' }
    ht_at_title_track{1..16} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_track<current()>', value: '<studioTitle("track", <current()>)>' }
    ht_at_title_take1 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take1', value: 'Vocals take 1' }
    ht_at_title_take2 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take2', value: 'Guitar take 2' }
    ht_at_title_take3 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take3', value: 'Drums take 3' }
    ht_at_title_take4 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take4', value: 'Piano take 4' }
    ht_at_title_take5 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take5', value: 'Bass take 5' }
    ht_at_title_take6 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take6', value: 'Strings take 6' }
    ht_at_title_take7 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take7', value: 'Brass take 7' }
    ht_at_title_take8 (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_take8', value: 'Synth take 8' }
    ht_at_title_voiceover{1..6} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_a_voiceover<current()>', value: '<studioTitle("voiceover", <current()>)>' }
    ht_at_title_clip{1..6} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_v_clip<current()>', value: '<studioTitle("clip", <current()>)>' }
    ht_at_title_footage{1..8} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_v_footage<current()>', value: 'Session footage #<current()>' }
    ht_at_title_bts{1..4} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_a_v_bts<current()>', value: 'Behind the scenes #<current()>' }
    ht_at_title_session{5..8} (extends ht_tpl_at): { definition: '@ht_ad_title', asset: '@ht_session<current()>', value: '<studioTitle("session", <current()>)>' }
    ht_at_releasetitle{1..4} (extends ht_tpl_at): { definition: '@ht_ad_releasetitle', asset: '@ht_album<current()>', value: '<studioTitle("album", <current()>)>' }

    # Artist and client: the artist of the album (ht_client_artist<n>) for its tracks, the takes
    # and the clips (studioArtist() follows the number modulo 4), the label for the albums, an
    # agency (2, 4, 6) or a radio (1, 3, 5) for the voice-overs
