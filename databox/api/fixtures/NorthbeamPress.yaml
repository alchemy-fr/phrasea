App\Entity\Core\Attribute:
    nb_tpl_at (template):
        origin: 0

    # Titles
    nb_at_name_p{1..40} (extends nb_tpl_at): { definition: '@nb_ad_name', asset: '@nb_a_v_p<current()>', value: 'Image #<current()>' }
    nb_at_name_e{41..46} (extends nb_tpl_at): { definition: '@nb_ad_name', asset: '@nb_a_v_e<current()>', value: 'Image #<current()>' }
    nb_at_name_s{47..66} (extends nb_tpl_at): { definition: '@nb_ad_name', asset: '@nb_a_v_s<current()>', value: 'Image #<current()>' }
    nb_at_name_video{1..10} (extends nb_tpl_at): { definition: '@nb_ad_name', asset: '@nb_a_v_video<current()>', value: 'Video #<current()>' }
    nb_at_name_podcast{1..10} (extends nb_tpl_at): { definition: '@nb_ad_name', asset: '@nb_a_d_podcast<current()>', value: 'Podcast #<current()>' }
    nb_at_name_release{1..10} (extends nb_tpl_at): { definition: '@nb_ad_name', asset: '@nb_a_d_release<current()>', value: 'Press release #<current()>' }
    # The headline and the caption describe the same scene, in the city where the asset was taken
    nb_at_headline_{@nb_a_v*} (extends nb_tpl_at): { definition: '@nb_ad_headline', asset: <current()>, value: '<newsHeadline(<current()>, <geoPlaceCity(<current()>)>)>' }
    nb_at_headline_podcast_{@nb_a_d_podcast*} (extends nb_tpl_at): { definition: '@nb_ad_headline', asset: <current()>, value: '<newsTitle("podcast")>' }
    nb_at_headline_release_{@nb_a_d_release*} (extends nb_tpl_at): { definition: '@nb_ad_headline', asset: <current()>, value: '<newsTitle("release")>' }
    nb_at_storytitle_{@nb_story*} (extends nb_tpl_at): { definition: '@nb_ad_storytitle', asset: <current()>, value: '<newsTitle("essay")>' }
