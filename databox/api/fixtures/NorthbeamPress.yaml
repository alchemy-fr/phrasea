# Collections (privacy):
# Desks (1)
#   World, Politics (1)
#   Sports (1)
#     Football > Premier League, World Cup; Tennis; Rugby (1)
#   Culture (3, alice) > Film, Music (3, alice)
# Archives (1) > 2024, 2025, 2026 (1)
# Embargoed (0)
# Wire Feed (2)
# Q&A "Live" — D&D \@][ \<ap>++"= (1): name with special characters
App\Entity\Core\Collection:
    nb_tpl_c (template):
        workspace: '@w_northbeam'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        privacy: 1

    nb_c_desks (extends nb_tpl_c):
        name: Desks
        translations: { name: { fr: Services } }
    # The desk collections (nb_c_desk_*) are the reference collections of the news assets
    nb_c_desk_world (extends nb_tpl_c):
        parent: '@nb_c_desks'
        name: World
        translations: { name: { fr: Monde } }
    nb_c_desk_politics (extends nb_tpl_c):
        parent: '@nb_c_desks'
        name: Politics
        translations: { name: { fr: Politique } }
    nb_c_desk_sports (extends nb_tpl_c):
        parent: '@nb_c_desks'
        name: Sports
        translations: { name: { fr: Sport } }
    nb_c_desk_football (extends nb_tpl_c):
        parent: '@nb_c_desk_sports'
        name: Football
    nb_c_desk_premierleague (extends nb_tpl_c):
        parent: '@nb_c_desk_football'
        name: Premier League
    nb_c_desk_worldcup (extends nb_tpl_c):
        parent: '@nb_c_desk_football'
        name: World Cup
        translations: { name: { fr: Coupe du monde } }
    nb_c_desk_tennis (extends nb_tpl_c):
        parent: '@nb_c_desk_sports'
        name: Tennis
    nb_c_desk_rugby (extends nb_tpl_c):
        parent: '@nb_c_desk_sports'
        name: Rugby
    nb_c_desk_culture (extends nb_tpl_c):
        parent: '@nb_c_desks'
        name: Culture
        ownerId: <keycloakUser("alice")>
        privacy: 3
    nb_c_desk_film (extends nb_tpl_c):
        parent: '@nb_c_desk_culture'
        name: Film
        ownerId: <keycloakUser("alice")>
        privacy: 3
        translations: { name: { fr: Cinéma } }
    nb_c_desk_music (extends nb_tpl_c):
        parent: '@nb_c_desk_culture'
        name: Music
        ownerId: <keycloakUser("alice")>
        privacy: 3
        translations: { name: { fr: Musique } }

    nb_c_archives (extends nb_tpl_c):
        name: Archives
    nb_c_archives_{2024, 2025, 2026} (extends nb_tpl_c):
        parent: '@nb_c_archives'
        name: '<current()>'
    nb_c_embargoed (extends nb_tpl_c):
        name: Embargoed
        privacy: 0
        translations: { name: { fr: Sous embargo } }
    nb_c_wirefeed (extends nb_tpl_c):
        name: Wire Feed
        privacy: 2
        translations: { name: { fr: Fil d'agence } }
    nb_c_special_chars (extends nb_tpl_c):
        name: 'Q&A "Live" — D&D \@][ \<ap>++"='

    # Collections of the "Photo essay" stories
    nb_sc{1..10} (extends nb_tpl_c):
        name: null

# Assets: images (nb_a_v_p* photos, nb_a_v_e* embargoed photos, nb_a_v_s* photos of the
# stories) and videos (nb_a_v_video*) are geolocated, podcasts and press releases (nb_a_d_*) are not.
# Images are numbered across the workspace (photos 1-40, embargoed 41-46, stories 47-66): the
# number is the lock of imageUrlRandomRatio(), and it links an asset to its files and renditions.
App\Entity\Core\Asset:
    nb_tpl_a (template):
        workspace: '@w_northbeam'
        ownerId: <keycloakUser("bob")>
        privacy: 1
        __calls:
            - addToCollection: ['@nb_c_desk_*', true, true]
            - addToCollection (25%?): ['@nb_c_wirefeed', true]
            - addToCollection (20%?): ['@nb_c_archives_*', true]
            - addToCollection (5%?): ['@nb_c_special_chars', true]
            - addTag (15%?): ['@nb_tag_breaking']
            - addTag (15%?): ['@nb_tag_exclusive']
            # Online or Offline
            - addTag (70%?): ['@nb_tag_o*']

    nb_a_v_p{1..40} (extends nb_tpl_a): { source: '@nb_f_m<current()>' }
    # Set before the calls, so that Embargoed stays the reference collection
    nb_a_v_e{41..46} (extends nb_tpl_a):
        source: '@nb_f_m<current()>'
        ownerId: <keycloakUser("alice")>
        referenceCollection: '@nb_c_embargoed'
        __calls:
            - addToCollection: ['@nb_c_embargoed', true]
            - addToCollection: ['@nb_c_archives_2026', true]
            - addTag: ['@nb_tag_embargo']
    # Two photos in each story
    nb_a_v_s{47..56} (extends nb_tpl_a):
        source: '@nb_f_m<current()>'
        __calls:
            - addToCollection: ['@nb_sc<($current - 46)>', true]
    nb_a_v_s{57..66} (extends nb_tpl_a):
        source: '@nb_f_m<current()>'
        __calls:
            - addToCollection: ['@nb_sc<($current - 56)>', true]
    nb_a_v_video{1..10} (extends nb_tpl_a):
        source: '@nb_f_video_m<current()>'
        ownerId: <keycloakUser("alice")>
    nb_a_d_podcast{1..10} (extends nb_tpl_a):
        source: '@nb_f_podcast<current()>'
        ownerId: <keycloakUser("alice")>
    nb_a_d_release{1..10} (extends nb_tpl_a):
        source: '@nb_f_release_m<current()>'
        ownerId: <keycloakUser("carol")>
    # "Photo essay" stories
    nb_story{1..10} (extends nb_tpl_a):
        ownerId: <keycloakUser("alice")>
        storyCollection: '@nb_sc<current()>'

App\Entity\Core\File:
    nb_tpl_file (template):
        workspace: '@w_northbeam'
        storage: s3_main
        pathPublic: '95%? true : false'
        __calls:
            - setNoAnalysisNeeded: []
    nb_tpl_jpg (template, extends nb_tpl_file):
        type: image/jpeg
        extension: jpg
    nb_tpl_mp4 (template, extends nb_tpl_file):
        type: video/mp4
        extension: mp4
    nb_tpl_mp3 (template, extends nb_tpl_file):
        type: audio/mp3
        extension: mp3
    nb_tpl_pdf (template, extends nb_tpl_file):
        type: application/pdf
        extension: pdf

    # m = source and main rendition (1000px, with a large metadata set), p = preview (500px),
    # t = thumbnail (200px), ta = animated thumbnail, h = print hi-res (2000px)
    nb_f_m{1..66} (extends nb_tpl_jpg): { path: '<imageUrlRandomRatio(@w_northbeam->id, <current()>, 1000, "reportage")>', metadata: '<largeJSONFileMetadata()>' }
    nb_f_p{1..66} (extends nb_tpl_jpg): { path: '<imageUrlRandomRatio(@w_northbeam->id, <current()>, 500, "reportage")>' }
    nb_f_t{1..66} (extends nb_tpl_jpg): { path: '<imageUrlRandomRatio(@w_northbeam->id, <current()>, 200, "reportage")>' }
    nb_f_ta{1..10} (extends nb_tpl_jpg): { path: '<imageUrlRandomRatio(@w_northbeam->id, <current()>, 200, "reportage")>' }
    nb_f_h{41..46} (extends nb_tpl_jpg): { path: '<imageUrlRandomRatio(@w_northbeam->id, <current()>, 2000, "reportage")>' }

    nb_f_video_m{1..10} (extends nb_tpl_mp4): { path: '<randomMedia(@w_northbeam->id, "mp4", <current()>, "northbeam-press/video")>', metadata: '<largeJSONFileMetadata()>' }
    nb_f_video_p{1..10} (extends nb_tpl_mp4): { path: '<randomMedia(@w_northbeam->id, "mp4", <current()>, "northbeam-press/video")>' }
    nb_f_video_t{1..10} (extends nb_tpl_mp4): { path: '<randomMedia(@w_northbeam->id, "mp4", <current()>, "northbeam-press/video")>' }
    nb_f_podcast{1..10} (extends nb_tpl_mp3): { path: '<randomMedia(@w_northbeam->id, "mp3", <current()>, "northbeam-press/podcast")>', metadata: '<largeJSONFileMetadata()>' }
    nb_f_release_m{1..10} (extends nb_tpl_pdf): { path: '<randomMedia(@w_northbeam->id, "pdf", <current()>, "northbeam-press/press-release")>', metadata: '<largeJSONFileMetadata()>' }
    nb_f_release_p{1..10} (extends nb_tpl_pdf): { path: '<randomMedia(@w_northbeam->id, "pdf", <current()>, "northbeam-press/press-release")>' }

App\Entity\Core\AssetRendition:
