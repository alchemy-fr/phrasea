# Northbeam Press: news agency. Multimedia editorial flow, geolocated, under embargo, multilingual.
# Personas: alice = editor-in-chief, bob = photographer, carol = freelancer (Sports only),
# dave = archivist.
# See doc/tech/Databox/fixtures.md

App\Entity\Core\Workspace:
    w_northbeam:
        __factory: { '@App\Fixture\WorkspaceFactory::create': ['<keycloakUser("phrasea-admin", ["phrasea-admin"])>'] }
        name: Northbeam Press
        slug: northbeam-press
        enabledLocales: [en, fr]

App\Entity\Core\AttributePolicy:
    # "Public" policy created by WorkspaceFactory
    nb_ap_public:
        __factory: { '@App\Fixture\WorkspaceFactory::getAttributePolicy': ['@w_northbeam'] }
    nb_ap_newsroom:
        workspace: '@w_northbeam'
        name: Newsroom only
        public: false
        editable: false

App\Entity\Core\RenditionPolicy:
    # "Public" policy created by WorkspaceFactory
    nb_rp_public:
        __factory: { '@App\Fixture\WorkspaceFactory::getRenditionPolicy': ['@w_northbeam'] }
    nb_rp_print:
        workspace: '@w_northbeam'
        name: Print
        public: false
        editable: false

App\Entity\Core\RenditionDefinition:
    # Definitions created by WorkspaceFactory
    nb_rd_{main, preview, thumbnail, animatedThumbnail}:
        __factory: { '@App\Fixture\WorkspaceFactory::getRenditionDefinition': ['@w_northbeam', '<current()>'] }
    nb_rd_print:
        workspace: '@w_northbeam'
        name: Print hi-res
        policy: '@nb_rp_print'
        parent: '@nb_rd_main'
        buildMode: 1
        translations: { name: { fr: Impression HD } }

App\Entity\Core\EntityList:
    nb_el_desk:
        workspace: '@w_northbeam'
        name: Desk
        withTranslations: true
        withSynonyms: true
    nb_el_rights:
        workspace: '@w_northbeam'
        name: Usage rights
        withTranslations: true
        withColors: true

App\Entity\Core\AttributeEntity:
    nb_tpl_desk (template):
        list: '@nb_el_desk'
        workspace: '@w_northbeam'
    nb_desk_world (extends nb_tpl_desk):
        value: World
        translations: { fr: Monde }
        synonyms: { en: [International, Foreign], fr: [International, Étranger] }
    nb_desk_politics (extends nb_tpl_desk):
        value: Politics
        translations: { fr: Politique }
        synonyms: { en: [Government, Elections], fr: [Gouvernement, Élections] }
    nb_desk_sports (extends nb_tpl_desk):
        value: Sports
        translations: { fr: Sport }
        synonyms: { en: [Sport], fr: [Sports] }
    nb_desk_culture (extends nb_tpl_desk):
        value: Culture
        translations: { fr: Culture }
        synonyms: { en: [Arts, Entertainment], fr: [Arts, Spectacles] }
    nb_desk_business (extends nb_tpl_desk):
        value: Business
        translations: { fr: Économie }
        synonyms: { en: [Economy, Finance], fr: [Finance, Entreprises] }

    nb_tpl_rights (template):
        list: '@nb_el_rights'
        workspace: '@w_northbeam'
    nb_rights_editorial (extends nb_tpl_rights):
        value: Editorial use only
        translations: { fr: Usage éditorial uniquement }
        color: '#1E88E5'
    nb_rights_royaltyfree (extends nb_tpl_rights):
        value: Royalty free
        translations: { fr: Libre de droits }
        color: '#43A047'
    nb_rights_managed (extends nb_tpl_rights):
        value: Rights managed
        translations: { fr: Droits gérés }
        color: '#FB8C00'
    nb_rights_nosyndication (extends nb_tpl_rights):
        value: Do not syndicate
        translations: { fr: Ne pas syndiquer }
        color: '#E53935'

App\Entity\Core\AttributeDefinition:
    nb_tpl_ad (template):
        workspace: '@w_northbeam'
        policy: '@nb_ap_public'
        type: text

    # "Name" attribute created by WorkspaceFactory, used as title when the headline is empty
    nb_ad_name:
        __factory: { '@App\Fixture\WorkspaceFactory::getNameAttributeDefinition': ['@w_northbeam'] }

    nb_ad_headline (extends nb_tpl_ad):
        name: Headline
        namePriority: 10
        suggest: true
        position: 1
        translations: { name: { fr: Titre } }
    nb_ad_storytitle (extends nb_tpl_ad):
        name: Story title
        target: '<(App\Model\AssetTypeEnum::Story)>'
        namePriority: 10
        position: 1
        translations: { name: { fr: Titre du reportage } }
    nb_ad_caption (extends nb_tpl_ad):
        name: Caption
        type: textarea
        translatable: true
        readFromMetadata:
            - XMP-dc:Description
        position: 2
        translations: { name: { fr: Légende } }
    nb_ad_byline (extends nb_tpl_ad):
        name: Byline
        facetEnabled: true
        initialValuesAll: |
            {{ file.metadata('IFD0:Artist').value ?? file.metadata('XMP-dc:Creator').value ?? file.metadata('IFD0:Copyright').value ?? file.metadata('IPTC:CopyrightNotice').value }}
        position: 3
        translations: { name: { fr: Signature } }
    nb_ad_keywords (extends nb_tpl_ad):
        name: Keywords
        multiple: true
        facetEnabled: true
        suggest: true
        readFromMetadata:
            - IPTC:Keywords
        position: 4
        translations: { name: { fr: Mots-clés } }
    nb_ad_location (extends nb_tpl_ad):
        name: Location
        type: geo_point
        position: 5
        translations: { name: { fr: Lieu } }
    nb_ad_city (extends nb_tpl_ad):
        name: City
        facetEnabled: true
        initialValuesAll: |
            {{ file.metadata('IPTC:City').value ?? file.metadata('XMP-photoshop:City').value }}
        position: 6
        translations: { name: { fr: Ville } }
    nb_ad_country (extends nb_tpl_ad):
        name: Country
        facetEnabled: true
        initialValuesAll: |
            {{ file.metadata('IPTC:Country-PrimaryLocationName').value ?? file.metadata('XMP-photoshop:Country').value }}
        position: 7
        translations: { name: { fr: Pays } }
    nb_ad_datetaken (extends nb_tpl_ad):
        name: Date taken
        type: date
        facetEnabled: true
        sortable: true
        initialValuesAll: |
            {{ file.metadata('ExifIFD:CreateDate').value ?? file.metadata('IPTC:DateCreated').value ?? file.metadata('IPTC:DigitalCreationDate').value }}
        position: 8
        translations: { name: { fr: Date de prise de vue } }
    nb_ad_publishedat (extends nb_tpl_ad):
        name: Published at
        type: date_time
        facetEnabled: true
        sortable: true
        position: 9
        translations: { name: { fr: Publié le } }
    nb_ad_desk (extends nb_tpl_ad):
        name: Desk
        type: entity
        entityList: '@nb_el_desk'
        facetEnabled: true
        suggest: true
        position: 10
        translations: { name: { fr: Service } }
    nb_ad_usagerights (extends nb_tpl_ad):
        name: Usage rights
        type: entity
        entityList: '@nb_el_rights'
        facetEnabled: true
        position: 11
        translations: { name: { fr: Droits d'usage } }
    nb_ad_embargountil (extends nb_tpl_ad):
        name: Embargo until
        type: date_time
        sortable: true
        position: 12
        translations: { name: { fr: Sous embargo jusqu'au } }
    nb_ad_wordcount (extends nb_tpl_ad):
        name: Word count
        type: number
        sortable: true
        position: 13
        translations: { name: { fr: Nombre de mots } }
    nb_ad_duration (extends nb_tpl_ad):
        name: Duration
        type: duration
        initialValuesAll: |
            {{ file.metadata('Composite:Duration').value }}
        position: 14
        translations: { name: { fr: Durée } }
    nb_ad_filesize (extends nb_tpl_ad):
        name: File size
        type: filesize
        initialValuesAll: |
            {{ file.metadata('Composite:FileSize').value }}
        position: 15
        translations: { name: { fr: Taille du fichier } }
    nb_ad_breaking (extends nb_tpl_ad):
        name: Breaking
        type: boolean
        facetEnabled: true
        position: 16
        translations: { name: { fr: Urgent } }
    # Its slug "webvtttranscript" is used by the AWS Transcribe integration
    nb_ad_webvtttranscript (extends nb_tpl_ad):
        name: WebVTT transcript
        type: code
        translatable: true
        policy: '@nb_ap_newsroom'
        position: 17
        translations: { name: { fr: Transcription WebVTT } }
    nb_ad_editornotes (extends nb_tpl_ad):
        name: Editor notes
        type: textarea
        policy: '@nb_ap_newsroom'
        position: 18
        translations: { name: { fr: Notes de la rédaction } }
    # Text of the watermark integration
    nb_ad_watermark (extends nb_tpl_ad):
        name: Watermark
        position: 19
        translations: { name: { fr: Filigrane } }
    # Filled by the Blurhash integration
    nb_ad_blurhash (extends nb_tpl_ad):
        name: Blurhash
        position: 20

App\Entity\Core\Tag:
