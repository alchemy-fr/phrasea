        translations: { name: { fr: Exclusif } }
    nb_tag_embargo (extends nb_tpl_tag):
        name: Embargo
        color: '#FB8C00'
    nb_tag_online (extends nb_tpl_tag):
        name: Online
        color: '#7EF284'
        translations: { name: { fr: En ligne } }
    nb_tag_offline (extends nb_tpl_tag):
        name: Offline
