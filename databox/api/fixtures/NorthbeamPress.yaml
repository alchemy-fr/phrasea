# Permissions. Masks of alchemy/acl-bundle: VIEW 1, CREATE 2, EDIT 4, DELETE 8, OPERATOR 32,
# MASTER 64, OWNER 128, SHARE 256; CHILD_* = the same bit << 9 (CHILD_VIEW 512, CHILD_CREATE 1024,
# CHILD_EDIT 2048, CHILD_OPERATOR 16384). Every persona is a member of the workspace (VIEW).
Alchemy\AclBundle\Entity\AccessControlEntry:
    nb_tpl_ace (template):
        userType: 0

    # alice, editor-in-chief: VIEW|EDIT|OPERATOR + CHILD_VIEW|CHILD_EDIT|CHILD_OPERATOR on the workspace
    nb_ace_ws_alice (extends nb_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: workspace
        objectId: '@w_northbeam->id'
        mask: 18981
    nb_ace_ws_{bob, carol, dave} (extends nb_tpl_ace):
        userId: <keycloakUser($current)>
        objectType: workspace
        objectId: '@w_northbeam->id'
        mask: 1
    # bob, photographer: VIEW|CREATE|EDIT + CHILD_VIEW|CHILD_CREATE|CHILD_EDIT on Desks
    nb_ace_bob_desks (extends nb_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: collection
        objectId: '@nb_c_desks->id'
        mask: 3591
    # carol, freelancer: VIEW + CHILD_VIEW on Sports only
    nb_ace_carol_sports (extends nb_tpl_ace):
        userId: <keycloakUser("carol")>
        objectType: collection
        objectId: '@nb_c_desk_sports->id'
        mask: 513
    # dave, archivist: VIEW|EDIT + CHILD_VIEW|CHILD_EDIT on Archives
    nb_ace_dave_archives (extends nb_tpl_ace):
        userId: <keycloakUser("dave")>
        objectType: collection
        objectId: '@nb_c_archives->id'
        mask: 2565
    # Restricted policies: VIEW (and EDIT) for the attributes, CHILD_VIEW (and CHILD_EDIT) for the renditions
    nb_ace_alice_newsroom (extends nb_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: attribute_policy
        objectId: '@nb_ap_newsroom->id'
        mask: 5
    nb_ace_bob_newsroom (extends nb_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: attribute_policy
        objectId: '@nb_ap_newsroom->id'
        mask: 1
    nb_ace_alice_print (extends nb_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: rendition_policy
        objectId: '@nb_rp_print->id'
        mask: 2560
    nb_ace_print_{bob, dave} (extends nb_tpl_ace):
        userId: <keycloakUser($current)>
        objectType: rendition_policy
        objectId: '@nb_rp_print->id'
        mask: 512

# carol does not see the assets under embargo
App\Entity\Core\AttributeFilterRule:
    nb_afr_embargo:
        workspace: '@w_northbeam'
        condition: '<aqlTagIsNot(@nb_tag_embargo->id)>'
        __calls:
            - addTarget: [0, '<keycloakUser("carol")>']

App\Entity\Core\AssetPolicy\AssetPolicy:
    nb_apol_embargo:
        workspace: '@w_northbeam'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        name: Embargo masking
        conditions:
            - { field: collection, operator: '=', value: '@nb_c_embargoed->id' }
        actions:
            - { action: hide_rendition, definitionId: '@nb_rd_print->id' }
            - { action: hide_attribute, definitionId: '@nb_ad_editornotes->id' }

App\Entity\Core\AssetPolicy\AssetPolicyUser:
    nb_apu_embargo_{carol, dave}:
        policy: '@nb_apol_embargo'
        userType: 0
        userId: <keycloakUser($current)>

App\Entity\Integration\WorkspaceIntegration:
    nb_tpl_wi (template):
        workspace: '@w_northbeam'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        public: true

    # Rendition integration created by WorkspaceFactory
    nb_wi_rendition:
        __factory: { '@App\Fixture\WorkspaceFactory::getIntegration': ['@w_northbeam', 'rendition'] }
    nb_wi_toast_ui (extends nb_tpl_wi):
        name: ToastUI
        integration: tui.photo-editor
    nb_wi_blurhash (extends nb_tpl_wi):
        integration: blurhash
        config:
            rendition: Thumbnail
        needs:
            - '@nb_wi_rendition'
    nb_wi_watermark (extends nb_tpl_wi):
        integration: core.watermark
        config:
            attributeName: watermark
            applyToRenditions:
                - Thumbnail
        needs:
            - '@nb_wi_rendition'
    nb_wi_transcribe (extends nb_tpl_wi):
        integration: aws.transcribe
        enabled: false
        config:
            region: eu-west-1
            workloadS3Bucket: northbeam-transcribe-workload
            attributes:
                vtt: webvtttranscript

App\Entity\Integration\WorkspaceSecret:
    nb_secret_{AWS_ACCESS_KEY_ID, AWS_ACCESS_KEY_SECRET}:
        workspace: '@w_northbeam'
        name: <current()>
        plainValue: xxx
