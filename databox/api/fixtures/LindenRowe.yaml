        name: Model release signed
        type: boolean
        facetEnabled: true
        position: 11
        translations: { name: { fr: Autorisation du modèle signée, it: Liberatoria firmata } }
    lr_ad_photographer (extends lr_tpl_ad):
        name: Photographer
        facetEnabled: true
        position: 12
        translations: { name: { fr: Photographe, it: Fotografo } }
    lr_ad_retailprice (extends lr_tpl_ad):
        name: Retail price
        type: number
        sortable: true
        policy: '@lr_ap_commercial'
        position: 13
        translations: { name: { fr: Prix de vente, it: Prezzo al dettaglio } }
    lr_ad_wholesaleprice (extends lr_tpl_ad):
        name: Wholesale price
        type: number
        sortable: true
        policy: '@lr_ap_commercial'
