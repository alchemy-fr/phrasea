# Linden & Rowe: ready-to-wear brand, product catalogue (PIM-like): seasons, products,
# confidential prices, public press kit.
# Personas: alice = marketing, bob = photo studio, carol = wholesale partner, dave = e-commerce.
# See doc/tech/Databox/fixtures.md

App\Entity\Core\Workspace:
    w_linden:
        __factory: { '@App\Fixture\WorkspaceFactory::create': ['<keycloakUser("phrasea-admin", ["phrasea-admin"])>'] }
        name: Linden & Rowe
        slug: linden-rowe
        enabledLocales: [en, fr, it]

App\Entity\Core\AttributePolicy:
    # "Public" policy created by WorkspaceFactory
    lr_ap_public:
        __factory: { '@App\Fixture\WorkspaceFactory::getAttributePolicy': ['@w_linden'] }
    lr_ap_commercial:
        workspace: '@w_linden'
        name: Commercial
        public: false
        editable: false

App\Entity\Core\RenditionPolicy:
    # "Public" policy created by WorkspaceFactory
    lr_rp_public:
        __factory: { '@App\Fixture\WorkspaceFactory::getRenditionPolicy': ['@w_linden'] }
    lr_rp_studio:
        workspace: '@w_linden'
        name: Studio
        public: false
        editable: false

App\Entity\Core\RenditionDefinition:
    # Definitions created by WorkspaceFactory
    lr_rd_{main, preview, thumbnail, animatedThumbnail}:
        __factory: { '@App\Fixture\WorkspaceFactory::getRenditionDefinition': ['@w_linden', '<current()>'] }
    lr_rd_zoom:
        workspace: '@w_linden'
        name: E-commerce zoom
        policy: '@lr_rp_studio'
        parent: '@lr_rd_main'
        buildMode: 1
        translations: { name: { fr: Zoom e-commerce, it: Zoom e-commerce } }

App\Entity\Core\EntityList:
    lr_el_colour:
        workspace: '@w_linden'
        name: Colour
        withTranslations: true
        withColors: true
    lr_el_size:
        workspace: '@w_linden'
        name: Size
    lr_el_material:
        workspace: '@w_linden'
