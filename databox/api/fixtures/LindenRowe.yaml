App\Entity\Core\Tag:
    lr_tpl_tag (template):
        workspace: '@w_linden'
    lr_tag_newin (extends lr_tpl_tag): { name: New in, color: '#26A69A', translations: { name: { fr: Nouveauté, it: Novità } } }
    lr_tag_bestseller (extends lr_tpl_tag): { name: Bestseller, color: '#FFB300', translations: { name: { fr: Meilleure vente, it: Più venduto } } }
    lr_tag_sale (extends lr_tpl_tag): { name: Sale, color: '#E53935', translations: { name: { fr: Soldes, it: Saldi } } }
    lr_tag_sustainable (extends lr_tpl_tag): { name: Sustainable, color: '#43A047', translations: { name: { fr: Responsable, it: Sostenibile } } }
    lr_tag_donotpublish (extends lr_tpl_tag): { name: Do not publish, color: '#424242', translations: { name: { fr: Ne pas publier, it: Non pubblicare } } }

# Collections (privacy):
# Seasons (1)
#   SS26 (1) > Womenswear > Dresses, Knitwear; Menswear > Shirts, Outerwear; Accessories > Bags, Footwear (1)
#   FW26 (unreleased) (0) > Womenswear, Menswear (0)
# Campaigns (1) > SS26 – Coastline (2), FW26 – Night Garden (0)
# Lookbooks (2)
# Press Kit (5)
# Retired (1)
App\Entity\Core\Collection:
    lr_tpl_c (template):
        workspace: '@w_linden'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        privacy: 1

    lr_c_seasons (extends lr_tpl_c): { name: Seasons, translations: { name: { fr: Saisons, it: Stagioni } } }
    lr_c_ss26 (extends lr_tpl_c): { parent: '@lr_c_seasons', name: SS26 }
    lr_c_ss26_women (extends lr_tpl_c): { parent: '@lr_c_ss26', name: Womenswear, translations: { name: { fr: Femme, it: Donna } } }
    lr_c_ss26_dresses (extends lr_tpl_c): { parent: '@lr_c_ss26_women', name: Dresses, translations: { name: { fr: Robes, it: Abiti } } }
    lr_c_ss26_knitwear (extends lr_tpl_c): { parent: '@lr_c_ss26_women', name: Knitwear, translations: { name: { fr: Maille, it: Maglieria } } }
    lr_c_ss26_men (extends lr_tpl_c): { parent: '@lr_c_ss26', name: Menswear, translations: { name: { fr: Homme, it: Uomo } } }
    lr_c_ss26_shirts (extends lr_tpl_c): { parent: '@lr_c_ss26_men', name: Shirts, translations: { name: { fr: Chemises, it: Camicie } } }
    lr_c_ss26_outerwear (extends lr_tpl_c): { parent: '@lr_c_ss26_men', name: Outerwear, translations: { name: { fr: Manteaux et vestes, it: Capispalla } } }
    lr_c_ss26_accessories (extends lr_tpl_c): { parent: '@lr_c_ss26', name: Accessories, translations: { name: { fr: Accessoires, it: Accessori } } }
    lr_c_ss26_bags (extends lr_tpl_c): { parent: '@lr_c_ss26_accessories', name: Bags, translations: { name: { fr: Sacs, it: Borse } } }
    lr_c_ss26_footwear (extends lr_tpl_c): { parent: '@lr_c_ss26_accessories', name: Footwear, translations: { name: { fr: Chaussures, it: Calzature } } }
    lr_c_fw26 (extends lr_tpl_c): { parent: '@lr_c_seasons', name: FW26 (unreleased), privacy: 0, translations: { name: { fr: FW26 (non publiée), it: FW26 (non pubblicata) } } }
    lr_c_fw26_women (extends lr_tpl_c): { parent: '@lr_c_fw26', name: Womenswear, privacy: 0, translations: { name: { fr: Femme, it: Donna } } }
    lr_c_fw26_men (extends lr_tpl_c): { parent: '@lr_c_fw26', name: Menswear, privacy: 0, translations: { name: { fr: Homme, it: Uomo } } }
    lr_c_campaigns (extends lr_tpl_c): { name: Campaigns, translations: { name: { fr: Campagnes, it: Campagne } } }
    lr_c_campaign_ss26 (extends lr_tpl_c): { parent: '@lr_c_campaigns', name: SS26 – Coastline, privacy: 2 }
    lr_c_campaign_fw26 (extends lr_tpl_c): { parent: '@lr_c_campaigns', name: FW26 – Night Garden, privacy: 0 }
    lr_c_lookbooks (extends lr_tpl_c): { name: Lookbooks, privacy: 2 }
    lr_c_presskit (extends lr_tpl_c): { name: Press Kit, privacy: 5, translations: { name: { fr: Kit presse, it: Cartella stampa } } }
    lr_c_retired (extends lr_tpl_c): { name: Retired, translations: { name: { fr: Retirés, it: Ritirati } } }

    # Collections of the "Look" stories
    lr_sc{1..6} (extends lr_tpl_c):
        name: null

# Assets: packshots (lr_a_p*), campaign photos (lr_a_c*), runway videos (lr_a_m_*), documents
# (lr_a_d_*) and the "Look" stories, made of a dress, a bag and a pair of shoes.
# Images are numbered across the workspace (packshots 1-52, campaign 53-64): the number is the
# lock of imageUrlRandomRatio(), and it links an asset to its source file.
App\Entity\Core\Asset:
    lr_tpl_a (template):
        workspace: '@w_linden'
        ownerId: <keycloakUser("bob")>
        privacy: 1

    lr_tpl_packshot (template, extends lr_tpl_a):
        __calls:
            - addTag (30%?): ['@lr_tag_newin']
            - addTag (20%?): ['@lr_tag_bestseller']
            - addTag (15%?): ['@lr_tag_sale']
            - addTag (30%?): ['@lr_tag_sustainable']
            - addTag (10%?): ['@lr_tag_donotpublish']

    # SS26 packshots, by category
    lr_a_p{1..6} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_ss26_dresses', true, true]
            - addToCollection: ['@lr_sc<current()>', true]
    lr_a_p{7..12} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_ss26_knitwear', true, true]
    lr_a_p{13..18} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_ss26_shirts', true, true]
    lr_a_p{19..24} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_ss26_outerwear', true, true]
    lr_a_p{25..30} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_ss26_bags', true, true]
            - addToCollection: ['@lr_sc<($current - 24)>', true]
    lr_a_p{31..36} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_ss26_footwear', true, true]
            - addToCollection: ['@lr_sc<($current - 30)>', true]
    # FW26 packshots (unreleased)
    lr_a_p{37..40} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_fw26_women', true, true]
            - addTag: ['@lr_tag_donotpublish']
    lr_a_p{41..44} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_fw26_men', true, true]
            - addTag: ['@lr_tag_donotpublish']
    # SS25 shirts, out of the catalogue
    lr_a_p{45..48} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        __calls:
            - addToCollection: ['@lr_c_retired', true, true]
    # SS26 dresses of the press kit
    lr_a_p{49..52} (extends lr_tpl_packshot):
        source: '@lr_f_m<current()>'
        privacy: 5
        __calls:
            - addToCollection: ['@lr_c_presskit', true, true]
            - addToCollection: ['@lr_c_ss26_dresses', true]

    # Campaign photos
    lr_a_c{53..58} (extends lr_tpl_a):
        source: '@lr_f_m<current()>'
        ownerId: <keycloakUser("alice")>
        __calls:
            - addToCollection: ['@lr_c_campaign_ss26', true, true]
            - addToCollection (30%?): ['@lr_c_lookbooks', true]
            - addToCollection (30%?): ['@lr_c_presskit', true]
    lr_a_c{59..64} (extends lr_tpl_a):
        source: '@lr_f_m<current()>'
        ownerId: <keycloakUser("alice")>
        __calls:
            - addToCollection: ['@lr_c_campaign_fw26', true, true]
            - addTag: ['@lr_tag_donotpublish']

    lr_a_m_runway{1..6} (extends lr_tpl_a):
        source: '@lr_f_runway_m<current()>'
        ownerId: <keycloakUser("alice")>
        __calls:
            - addToCollection: ['@lr_c_campaigns', true, true]
            - addToCollection (50%?): ['@lr_c_lookbooks', true]
    lr_a_d_spec{1..6} (extends lr_tpl_a):
        source: '@lr_f_spec<current()>'
        ownerId: <keycloakUser("dave")>
        __calls:
            - addToCollection: ['@lr_c_ss26', true, true]
    lr_a_d_lookbook{1..2} (extends lr_tpl_a):
        source: '@lr_f_lookbook<current()>'
        ownerId: <keycloakUser("alice")>
        __calls:
            - addToCollection: ['@lr_c_lookbooks', true, true]
    lr_a_d_lookbook{3..4} (extends lr_tpl_a):
        source: '@lr_f_lookbook<current()>'
        ownerId: <keycloakUser("alice")>
        privacy: 5
        __calls:
            - addToCollection: ['@lr_c_presskit', true, true]
            - addToCollection: ['@lr_c_lookbooks', true]

    # "Look" stories
    lr_look{1..6} (extends lr_tpl_a):
        ownerId: <keycloakUser("alice")>
        storyCollection: '@lr_sc<current()>'
        __calls:
            - addToCollection: ['@lr_c_lookbooks', true, true]

App\Entity\Core\File:
    lr_tpl_file (template):
        workspace: '@w_linden'
        storage: s3_main
        pathPublic: '95%? true : false'
        __calls:
            - setNoAnalysisNeeded: []
    lr_tpl_jpg (template, extends lr_tpl_file):
        type: image/jpeg
        extension: jpg
    lr_tpl_mp4 (template, extends lr_tpl_file):
        type: video/mp4
        extension: mp4
    lr_tpl_pdf (template, extends lr_tpl_file):
        type: application/pdf
        extension: pdf

    # Source files only (m = image source, 1000px): the renditions are built by the ingest
    # workflow run after the load
    lr_f_m{1..64} (extends lr_tpl_jpg): { path: '<imageUrlRandomRatio(@w_linden->id, <current()>, 1000, "fashion")>' }

    lr_f_runway_m{1..6} (extends lr_tpl_mp4): { path: '<randomMedia(@w_linden->id, "mp4", <current()>, "linden-rowe/runway")>' }
    lr_f_spec{1..6} (extends lr_tpl_pdf): { path: '<randomMedia(@w_linden->id, "pdf", <current()>, "linden-rowe/spec-sheet")>' }
    lr_f_lookbook{1..4} (extends lr_tpl_pdf): { path: '<randomMedia(@w_linden->id, "pdf", <current()>, "linden-rowe/lookbook")>' }

App\Entity\Core\Attribute:
    lr_tpl_at (template):
        origin: 0

    # Product names by category. productName() picks the product of the asset, so it must come
    # before retailPrice(), wholesalePrice() and marketingCopy().
    lr_at_product{1..6} (extends lr_tpl_at): { definition: '@lr_ad_productname', asset: '@lr_a_p<current()>', value: '<productName(@lr_a_p<current()>, "dress")>' }
    lr_at_product{7..12} (extends lr_tpl_at): { definition: '@lr_ad_productname', asset: '@lr_a_p<current()>', value: '<productName(@lr_a_p<current()>, "knit")>' }
