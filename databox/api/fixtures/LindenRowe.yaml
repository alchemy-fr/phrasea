        facetEnabled: true
        position: 4
        translations: { name: { fr: Couleur, it: Colore } }
    lr_ad_sizes (extends lr_tpl_ad):
        name: Sizes
        type: entity
        entityList: '@lr_el_size'
        multiple: true
        facetEnabled: true
        position: 5
        translations: { name: { fr: Tailles, it: Taglie } }
    lr_ad_material (extends lr_tpl_ad):
        name: Material
        type: entity
        entityList: '@lr_el_material'
        facetEnabled: true
        position: 6
        translations: { name: { fr: Matière, it: Materiale } }
    lr_ad_gender (extends lr_tpl_ad):
        name: Gender
        type: entity
        entityList: '@lr_el_gender'
        facetEnabled: true
        position: 7
        translations: { name: { fr: Ligne, it: Linea } }
    lr_ad_season (extends lr_tpl_ad):
        name: Season
        type: entity
        entityList: '@lr_el_season'
        facetEnabled: true
        sortable: true
