        translations: { name: { fr: Saison, it: Stagione } }
    lr_ad_launchdate (extends lr_tpl_ad):
        name: Launch date
        type: date
        facetEnabled: true
        sortable: true
        position: 9
        translations: { name: { fr: Date de lancement, it: Data di lancio } }
    lr_ad_rightsexpiry (extends lr_tpl_ad):
        name: Rights expiry
        type: date_time
        sortable: true
        position: 10
        translations: { name: { fr: Fin des droits, it: Scadenza dei diritti } }
