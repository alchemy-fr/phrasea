# Permissions. Masks of alchemy/acl-bundle: VIEW 1, CREATE 2, EDIT 4, DELETE 8, OPERATOR 32,
# MASTER 64, OWNER 128, SHARE 256; CHILD_* = the same bit << 9 (CHILD_VIEW 512, CHILD_CREATE 1024,
# CHILD_EDIT 2048). Every persona is a member of the workspace (VIEW).
Alchemy\AclBundle\Entity\AccessControlEntry:
    lr_tpl_ace (template):
        userType: 0

    lr_ace_ws_{alice, bob, carol} (extends lr_tpl_ace):
        userId: <keycloakUser($current)>
        objectType: workspace
        objectId: '@w_linden->id'
        mask: 1
    # dave, e-commerce: VIEW + CHILD_VIEW on the workspace
    lr_ace_ws_dave (extends lr_tpl_ace):
        userId: <keycloakUser("dave")>
        objectType: workspace
        objectId: '@w_linden->id'
        mask: 513
    # bob, photo studio: VIEW|CREATE|EDIT + CHILD_VIEW|CHILD_CREATE|CHILD_EDIT on Seasons
    lr_ace_bob_seasons (extends lr_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: collection
        objectId: '@lr_c_seasons->id'
        mask: 3591
    # alice, marketing: VIEW|EDIT + CHILD_VIEW|CHILD_EDIT on Campaigns, Lookbooks and Press Kit
    lr_ace_alice_{campaigns, lookbooks, presskit} (extends lr_tpl_ace):
        userId: <keycloakUser("alice")>
        objectType: collection
        objectId: '@lr_c_<current()>->id'
        mask: 2565
    # carol, wholesale partner: VIEW + CHILD_VIEW on SS26 and Press Kit
    lr_ace_carol_{ss26, presskit} (extends lr_tpl_ace):
        userId: <keycloakUser("carol")>
        objectType: collection
        objectId: '@lr_c_<current()>->id'
        mask: 513
    # Restricted policies: VIEW for the attributes, CHILD_VIEW (and CHILD_EDIT) for the renditions
    lr_ace_commercial_{alice, carol, dave} (extends lr_tpl_ace):
        userId: <keycloakUser($current)>
        objectType: attribute_policy
        objectId: '@lr_ap_commercial->id'
        mask: 1
    lr_ace_bob_studio (extends lr_tpl_ace):
        userId: <keycloakUser("bob")>
        objectType: rendition_policy
        objectId: '@lr_rp_studio->id'
        mask: 2560
    lr_ace_studio_{carol, dave} (extends lr_tpl_ace):
        userId: <keycloakUser($current)>
        objectType: rendition_policy
        objectId: '@lr_rp_studio->id'
        mask: 512

# carol does not see the assets that must not be published
App\Entity\Core\AttributeFilterRule:
    lr_afr_donotpublish:
        workspace: '@w_linden'
        condition: '<aqlTagIsNot(@lr_tag_donotpublish->id)>'
        __calls:
            - addTarget: [0, '<keycloakUser("carol")>']

# In the press kit, carol sees neither the prices nor the zoom
App\Entity\Core\AssetPolicy\AssetPolicy:
    lr_apol_presskit:
        workspace: '@w_linden'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        name: Press kit
        conditions:
            - { field: collection, operator: '=', value: '@lr_c_presskit->id' }
        actions:
            - { action: hide_attribute, definitionId: '@lr_ad_retailprice->id' }
            - { action: hide_attribute, definitionId: '@lr_ad_wholesaleprice->id' }
            - { action: hide_rendition, definitionId: '@lr_rd_zoom->id' }

App\Entity\Core\AssetPolicy\AssetPolicyUser:
    lr_apu_presskit_{carol}:
        policy: '@lr_apol_presskit'
        userType: 0
        userId: <keycloakUser($current)>

App\Entity\Integration\WorkspaceIntegration:
    lr_tpl_wi (template):
        workspace: '@w_linden'
        ownerId: <keycloakUser("phrasea-admin", ["phrasea-admin"])>
        public: true

    # Rendition integration created by WorkspaceFactory
    lr_wi_rendition:
        __factory: { '@App\Fixture\WorkspaceFactory::getIntegration': ['@w_linden', 'rendition'] }
    lr_wi_toast_ui (extends lr_tpl_wi):
        name: ToastUI
        integration: tui.photo-editor
    lr_wi_blurhash (extends lr_tpl_wi):
        integration: blurhash
        config:
            rendition: '@lr_rd_thumbnail->id'
        needs:
            - '@lr_wi_rendition'
    lr_wi_similarity (extends lr_tpl_wi):
        integration: core.similarity
        config:
            rendition: '@lr_rd_preview->id'
        needs:
            - '@lr_wi_rendition'
    lr_wi_face_recognition (extends lr_tpl_wi):
        integration: core.face_recognition
        config:
            attribute: models
            rendition: '@lr_rd_preview->id'
            processIncoming: true
        needs:
            - '@lr_wi_rendition'
    lr_wi_removebg (extends lr_tpl_wi):
        integration: remove.bg
        enabled: false
        config:
            apiKey: \${REMOVE_BG_API_KEY}
    lr_wi_webhook (extends lr_tpl_wi):
        integration: core.webhook
        enabled: false
        config:
            url: https://pim.linden-rowe.example/hooks/databox

App\Entity\Integration\WorkspaceSecret:
    lr_secret_remove_bg:
        workspace: '@w_linden'
        name: REMOVE_BG_API_KEY
        plainValue: xxx
