    lr_gender_men (extends lr_tpl_gender): { value: Menswear, translations: { fr: Homme, it: Uomo } }
    lr_gender_unisex (extends lr_tpl_gender): { value: Unisex, translations: { fr: Mixte, it: Unisex } }

    lr_tpl_season (template):
        list: '@lr_el_season'
        workspace: '@w_linden'
    lr_season_ss25 (extends lr_tpl_season): { value: SS25, translations: { fr: Printemps-été 2025, it: Primavera-estate 2025 }, emoji: '🌞' }
