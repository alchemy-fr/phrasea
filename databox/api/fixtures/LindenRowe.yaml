    lr_ad_productname (extends lr_tpl_ad):
        name: Product name
        namePriority: 10
        suggest: true
        position: 1
        translations: { name: { fr: Nom du produit, it: Nome del prodotto } }
    lr_ad_sku (extends lr_tpl_ad):
        name: SKU
        type: keyword
        sortable: true
        suggest: true
        position: 2
    lr_ad_ean (extends lr_tpl_ad):
        name: EAN
        type: keyword
        suggest: true
        position: 3
    lr_ad_colour (extends lr_tpl_ad):
