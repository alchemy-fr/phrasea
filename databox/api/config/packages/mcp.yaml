# The HTTP path (/mcp), the host check and the session store are set by AlchemyMcpBundle.
mcp:
    servers:
        databox:
            name: 'Phrasea Databox'
            description: 'Search, describe and organize the assets of Phrasea Databox, follow their processing, and set up its workspaces (attributes, entity lists, renditions, integrations).'
            instructions: |
                Phrasea Databox is a digital asset management system. Every call runs with the permissions of the
                authenticated user: what the user cannot see or change is not returned or is refused.

                Model:
                - A workspace holds everything else: collections, assets, attribute definitions, entity lists,
                  rendition definitions and policies, integrations.
                - Collections form a tree inside a workspace. An asset belongs to one workspace and to any number
                  of its collections. A story is an asset that groups other assets.
                - The metadata of an asset are attributes: a value (per locale when the definition is translatable)
                  of an attribute definition. Definitions have a type (text, number, date, keyword, entity…), may be
                  multiple-valued and belong to an attribute policy, which controls who can read or edit them.
                  Entity attributes take their values from an entity list: they hold the IDs of its entities
                  (list_entities, create_entity). The labels, keywords or tags of the assets are such attributes.
                - Renditions are the files derived from the source file of an asset (thumbnail, preview…). Each one
                  is described by a rendition definition, whose "definition" is a YAML build configuration (read
                  get_rendition_build_reference before writing one), grouped under rendition policies.
                - The ingest of an asset (metadata reading, renditions, integrations) runs in the background as a
                  workflow (list_workflows, reprocess_asset). An asset whose file analysis failed is quarantined
                  until resolved (check_quarantined_assets, resolve_quarantined_assets).

                Search (search_assets) combines a full-text "query" with AQL "conditions", e.g.
                `title STARTS WITH "Report" AND (tags HAS ALL OF ("<entity ID>", "<entity ID>") OR description IS EMPTY)`:
                a condition is `field OPERATOR [value]`, a field is an attribute slug or a built-in one (@collection,
                @workspace, @createdAt…, see list_built_in_attributes), operators are uppercase (IS, IS NOT, <, >,
                BETWEEN, IS ANY OF, HAS ALL OF, IS EMPTY, CONTAINS, STARTS WITH, MATCHES…), conditions combine with
                AND, OR, NOT and parentheses. An entity attribute (such as "tags") is compared with entity IDs, found
                with list_entities, not with their labels.

                Prefer reading before writing: get the IDs of workspaces, definitions, collections and entities
                from the list tools (list_workspaces, list_attribute_definitions, list_collections, list_entities)
                rather than guessing them.
            # tools/list in a single page: some clients do not follow the pagination cursor
            pagination_limit: 100
            registry:
                tools: ['App\Mcp\Tool\']
