name: asset-ingest

on:
    asset_ingest:
        inputs:
            assetId:
                required: true
            workspaceId:
                required: true

jobs:
    import_source:
        name: Import source file
        if: App\Service\Workflow\Action\ImportSourceFileAction::evaluateIf
        # Skipped when there is nothing to import: the integrations still run.
        continue-on-skip: true
        steps:
            -   uses: App\Service\Workflow\Action\ImportSourceFileAction
