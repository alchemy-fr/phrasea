imports:
    - './services_dev.yaml'

services:
    App\Tests\Functional\Rendition\Phraseanet\PhraseanetApiClientFactoryMock: ~
    App\Integration\Phraseanet\PhraseanetApiClientFactory: '@App\Tests\Functional\Rendition\Phraseanet\PhraseanetApiClientFactoryMock'
    App\Tests\Functional\Face\FaceRecognitionClientMock: ~
    App\Integration\Core\FaceRecognition\FaceRecognitionClient: '@App\Tests\Functional\Face\FaceRecognitionClientMock'
    App\Tests\Functional\Similarity\EmbedderClientMock: ~
    App\Service\Vector\EmbedderClient: '@App\Tests\Functional\Similarity\EmbedderClientMock'
    App\Tests\Functional\Integration\Expose\ExposeHttpClientMock:
        arguments: ['@http_client']
    App\Integration\Phrasea\PhraseaClientFactory:
        autowire: true
        arguments:
            $client: '@App\Tests\Functional\Integration\Expose\ExposeHttpClientMock'
    App\Tests\Functional\Integration\Aws\Transcribe\SnsCertificateClientMock: ~
    App\Integration\Aws\Sns\SnsCertificateClient: '@App\Tests\Functional\Integration\Aws\Transcribe\SnsCertificateClientMock'
    test.storage.s3_client:
        class: Aws\S3\S3Client
        decorates: alchemy_storage.s3_client
        factory: ['App\Tests\Functional\Storage\LocalS3Handler', 'install']
        arguments: ['@.inner', '@test.storage.local_filesystem', '%env(S3_PATH_PREFIX)%']
