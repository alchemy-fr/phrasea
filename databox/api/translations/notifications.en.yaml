asset:
    new_comment:
        email:
            subject: 'New comment on %name%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> commented on <a href="%url%">%name%</a>.</p>'
        in_app:
            subject: 'New comment'
            body: '%author% commented on %name%.'
        sms:
            body: '%author% commented on %name%.'
    delete:
        email:
            subject: 'Asset deleted: %name%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> deleted <em>%name%</em>.</p>'
        in_app:
            subject: 'Asset deleted'
            body: '%author% deleted %name%.'
        sms:
            body: '%author% deleted %name%.'
    update:
        email:
            subject: 'Asset updated: %name%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> updated <a href="%url%">%name%</a>.</p>'
            body_with_collection: '<p>Hi %recipient%,</p><p><strong>%author%</strong> updated <a href="%url%">%name%</a> in <em>%collection%</em>.</p>'
        in_app:
            subject: 'Asset updated'
            body: '%author% updated %name%.'
        sms:
            body: '%author% updated %name%.'
collection:
    asset_add:
        email:
            subject: 'New asset in %collectionName%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> added <a href="%url%">%assetName%</a> to <em>%collectionName%</em>.</p>'
        in_app:
            subject: 'New asset in %collectionName%'
            body: '%author% added <strong>%assetName%</strong> to %collectionName%.'
        sms:
            body: '%author% added %assetName% to %collectionName%.'
    asset_remove:
        email:
            subject: 'Asset removed from %collectionName%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> removed <em>%assetName%</em> from <em>%collectionName%</em>.</p>'
        in_app:
            subject: 'Asset removed'
            body: '%author% removed %assetName% from %collectionName%.'
        sms:
            body: '%author% removed %assetName% from %collectionName%.'
