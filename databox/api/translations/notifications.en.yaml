asset:
    new_comment:
        email:
            subject: 'New comment on %name%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> commented on <a href="%url%">%name%</a>.</p>'
        email_digest:
            subject: '%count% new comments on your assets'
            group: '<p><strong>%authors%</strong> commented on <a href="%url%">%name%</a>.</p>|<p><strong>%count%</strong> new comments on <a href="%url%">%name%</a> by %authors%.</p>'
        in_app:
            subject: 'New comment'
            body: '%author% commented on %name%.'
        sms:
            body: '%author% commented on %name%.'
    delete:
        email:
            subject: 'Asset deleted: %name%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> deleted <em>%name%</em>.</p>'
        in_app:
            subject: 'Asset deleted'
            body: '%author% deleted %name%.'
        sms:
            body: '%author% deleted %name%.'
    update:
        email:
            subject: 'Asset updated: %name%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> updated <a href="%url%">%name%</a>.</p>'
            body_with_collection: '<p>Hi %recipient%,</p><p><strong>%author%</strong> updated <a href="%url%">%name%</a> in <em>%collection%</em>.</p>'
        in_app:
            subject: 'Asset updated'
            body: '%author% updated %name%.'
        sms:
            body: '%author% updated %name%.'
collection:
    asset_add:
        email:
            subject: 'New asset in %collectionName%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> added <a href="%url%">%assetName%</a> to <em>%collectionName%</em>.</p>'
        email_digest:
            subject: '%count% assets added to your collections'
            group: '<p>%count% asset added to <a href="%url%"><em>%collectionName%</em></a>:</p>|<p>%count% assets added to <a href="%url%"><em>%collectionName%</em></a>:</p>'
            item: '<strong>%assetName%</strong> — added by %author%'
        in_app:
            subject: 'New asset in %collectionName%'
            body: '%author% added <strong>%assetName%</strong> to %collectionName%.'
        sms:
            body: '%author% added %assetName% to %collectionName%.'
    asset_remove:
        email:
            subject: 'Asset removed from %collectionName%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> removed <em>%assetName%</em> from <em>%collectionName%</em>.</p>'
        email_digest:
            subject: '%count% assets removed from your collections'
            group: '<p>%count% asset removed from <a href="%url%"><em>%collectionName%</em></a>:</p>|<p>%count% assets removed from <a href="%url%"><em>%collectionName%</em></a>:</p>'
            item: '<strong>%assetName%</strong> — removed by %author%'
        in_app:
            subject: 'Asset removed'
            body: '%author% removed %assetName% from %collectionName%.'
        sms:
            body: '%author% removed %assetName% from %collectionName%.'
discussion:
    new_comment:
        email:
            subject: 'New comment on %object%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> commented on <a href="%url%">%object%</a>.</p>'
        email_digest:
            subject: '%count% new comments'
            group: '<p><strong>%authors%</strong> commented on <a href="%url%">%object%</a>.</p>|<p><strong>%count%</strong> new comments on <a href="%url%">%object%</a> by %authors%.</p>'
        in_app:
            subject: 'New comment'
            body: '%author% commented on %object%.'
        sms:
            body: '%author% commented on %object%.'
entity_list:
    pending_value:
        email:
            subject: 'New value awaiting approval in %listName%'
            body: '<p>Hi %recipient%,</p><p><strong>%author%</strong> added the value <strong>%value%</strong> to <a href="%url%"><em>%listName%</em></a>. It is awaiting your approval.</p>'
        in_app:
            subject: 'New value awaiting approval in %listName%'
            body: '%author% added <strong>%value%</strong> to %listName%. It is awaiting your approval.'
        sms:
            body: '%author% added %value% to %listName%. It is awaiting your approval.'
notification_digest:
    greeting: '<p>Hi %recipient%,</p>'
    more: '<p>…and %count% more.</p>'
    more_items: '…and %count% more'
user:
    exception:
        email:
            subject: 'An error occurred'
            greeting: 'Hi %recipient%,'
        in_app:
            subject: 'An error occurred'
