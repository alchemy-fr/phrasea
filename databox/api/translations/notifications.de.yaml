asset:
    new_comment:
        email:
            subject: 'Neuer Kommentar zu %name%'
            body: '<p>Hallo %recipient%,</p><p><strong>%author%</strong> hat <a href="%url%">%name%</a> kommentiert.</p>'
        in_app:
            subject: 'Neuer Kommentar'
            body: '%author% hat %name% kommentiert.'
        sms:
            body: '%author% hat %name% kommentiert.'
    delete:
        email:
            subject: 'Asset gelöscht: %name%'
            body: '<p>Hallo %recipient%,</p><p><strong>%author%</strong> hat <em>%name%</em> gelöscht.</p>'
        in_app:
            subject: 'Asset gelöscht'
            body: '%author% hat %name% gelöscht.'
        sms:
            body: '%author% hat %name% gelöscht.'
    update:
        email:
