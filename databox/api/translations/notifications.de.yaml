asset:
    new_comment:
        email:
            subject: 'Neuer Kommentar zu %name%'
            body: '<p>Hallo %recipient%,</p><p><strong>%author%</strong> hat <a href="%url%">%name%</a> kommentiert.</p>'
        email_digest:
            subject: '%count% neue Kommentare zu Ihren Assets'
            group: '<p><strong>%authors%</strong> hat <a href="%url%">%name%</a> kommentiert.</p>|<p><strong>%count%</strong> neue Kommentare zu <a href="%url%">%name%</a> von %authors%.</p>'
