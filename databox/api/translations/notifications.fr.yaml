automation:
    report:
        email:
            subject_new: '{0}Aucun nouvel asset dans %savedSearchName% (%automationName%)|{1}1 nouvel asset dans %savedSearchName% (%automationName%)|]1,Inf[%count% nouveaux assets dans %savedSearchName% (%automationName%)'
            subject_all: '{0}Aucun asset dans %savedSearchName% (%automationName%)|{1}1 asset dans %savedSearchName% (%automationName%)|]1,Inf[%count% assets dans %savedSearchName% (%automationName%)'
            greeting: 'Bonjour %recipient%,'
            intro_new: '{0}L''automatisation <strong>%automationName%</strong> n''a trouvé aucun nouvel asset dans la recherche enregistrée <a href="%url%">%savedSearchName%</a>.|{1}L''automatisation <strong>%automationName%</strong> a trouvé 1 nouvel asset dans la recherche enregistrée <a href="%url%">%savedSearchName%</a> :|]1,Inf[L''automatisation <strong>%automationName%</strong> a trouvé %count% nouveaux assets dans la recherche enregistrée <a href="%url%">%savedSearchName%</a> :'
            intro_all: '{0}L''automatisation <strong>%automationName%</strong> n''a trouvé aucun asset dans la recherche enregistrée <a href="%url%">%savedSearchName%</a>.|{1}L''automatisation <strong>%automationName%</strong> a traité 1 asset de la recherche enregistrée <a href="%url%">%savedSearchName%</a> :|]1,Inf[L''automatisation <strong>%automationName%</strong> a traité %count% assets de la recherche enregistrée <a href="%url%">%savedSearchName%</a> :'
            open_search: 'Ouvrir la recherche enregistrée'
        in_app:
            subject_new: '{0}Aucun nouvel asset dans %savedSearchName%|{1}1 nouvel asset dans %savedSearchName%|]1,Inf[%count% nouveaux assets dans %savedSearchName%'
            subject_all: '{0}Aucun asset dans %savedSearchName%|{1}1 asset dans %savedSearchName%|]1,Inf[%count% assets dans %savedSearchName%'
            body_new: '{0}%automationName% : aucun nouvel asset dans %savedSearchName%.|{1}%automationName% : 1 nouvel asset dans %savedSearchName% :|]1,Inf[%automationName% : %count% nouveaux assets dans %savedSearchName% :'
            body_all: '{0}%automationName% : aucun asset dans %savedSearchName%.|{1}%automationName% : 1 asset traité dans %savedSearchName% :|]1,Inf[%automationName% : %count% assets traités dans %savedSearchName% :'
        more: '…et %count% de plus.'
        untitled: 'Sans titre'
asset:
    new_comment:
        email:
            action: 'Voir le commentaire'
            subject: 'Nouveau commentaire sur %name%'
            body: '<p>Bonjour %recipient%,</p><p><strong>%author%</strong> a commenté <a href="%url%">%name%</a>.</p>'
        email_digest:
            subject: '%count% nouveaux commentaires sur vos assets'
            group: '<p><strong>%authors%</strong> a commenté <a href="%url%">%name%</a>.</p>|<p><strong>%count%</strong> nouveaux commentaires sur <a href="%url%">%name%</a> par %authors%.</p>'
        in_app:
            subject: 'Nouveau commentaire'
            body: '%author% a commenté %name%.'
        sms:
            body: '%author% a commenté %name%.'
    delete:
        email:
            subject: 'Asset supprimé : %name%'
            body: '<p>Bonjour %recipient%,</p><p><strong>%author%</strong> a supprimé <em>%name%</em>.</p>'
        in_app:
            subject: 'Asset supprimé'
            body: '%author% a supprimé %name%.'
        sms:
            body: '%author% a supprimé %name%.'
    update:
        email:
            action: 'Voir l''asset'
            subject: 'Asset mis à jour : %name%'
            body: '<p>Bonjour %recipient%,</p><p><strong>%author%</strong> a mis à jour <a href="%url%">%name%</a>.</p>'
            body_with_collection: '<p>Bonjour %recipient%,</p><p><strong>%author%</strong> a mis à jour <a href="%url%">%name%</a> dans <em>%collection%</em>.</p>'
        in_app:
            subject: 'Asset mis à jour'
            body: '%author% a mis à jour %name%.'
        sms:
            body: '%author% a mis à jour %name%.'
collection:
    asset_add:
        email:
            action: 'Voir l''asset'
            subject: 'Nouvel asset dans %collectionName%'
            body: '<p>Bonjour %recipient%,</p><p><strong>%author%</strong> a ajouté <a href="%url%">%assetName%</a> à <em>%collectionName%</em>.</p>'
        email_digest:
            subject: '%count% assets ajoutés à vos collections'
            group: '<p>%count% asset ajouté à <a href="%url%"><em>%collectionName%</em></a> :</p>|<p>%count% assets ajoutés à <a href="%url%"><em>%collectionName%</em></a> :</p>'
            item: '<strong>%assetName%</strong> — ajouté par %author%'
        in_app:
            subject: 'Nouvel asset dans %collectionName%'
            body: '%author% a ajouté <strong>%assetName%</strong> à %collectionName%.'
        sms:
            body: '%author% a ajouté %assetName% à %collectionName%.'
    asset_remove:
        email:
            subject: 'Asset retiré de %collectionName%'
            body: '<p>Bonjour %recipient%,</p><p><strong>%author%</strong> a retiré <em>%assetName%</em> de <em>%collectionName%</em>.</p>'
        email_digest:
            subject: '%count% assets retirés de vos collections'
            group: '<p>%count% asset retiré de <a href="%url%"><em>%collectionName%</em></a> :</p>|<p>%count% assets retirés de <a href="%url%"><em>%collectionName%</em></a> :</p>'
            item: '<strong>%assetName%</strong> — retiré par %author%'
        in_app:
            subject: 'Asset retiré'
            body: '%author% a retiré %assetName% de %collectionName%.'
        sms:
            body: '%author% a retiré %assetName% de %collectionName%.'
