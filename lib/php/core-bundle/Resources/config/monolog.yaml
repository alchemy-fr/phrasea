parameters:
    # Level that triggers the "fingers_crossed" replay in prod: below it nothing reaches
    # stderr, at it (and above) the buffered context is flushed with the record.
    env(LOG_ACTION_LEVEL): 'error'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    alchemy_core.monolog.line_formatter_stack_trace:
        class: Monolog\Formatter\LineFormatter
        calls:
            - [includeStacktraces]

when@test:
    services:
        Monolog\Handler\TestHandler:
            public: true
            alias: monolog.handler.test
