monolog:
    channels:
        - deprecation
    handlers:
        main:
            type: fingers_crossed
            action_level: '%env(LOG_ACTION_LEVEL)%'
            passthru_level: warning
            stop_buffering: false
            handler: stderr
            excluded_http_codes: [404, 403, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            channels:
                - '!event'
                - '!php'
                - '!deprecation'

        stderr:
            type: stream
            path: php://stderr
            level: debug
            formatter: alchemy_core.monolog.line_formatter_stack_trace

        console:
            type: console
            process_psr_3_messages: false
            verbosity_levels:
                VERBOSITY_QUIET: EMERGENCY
                VERBOSITY_NORMAL: ERROR
                VERBOSITY_VERBOSE: NOTICE
                VERBOSITY_VERY_VERBOSE: INFO
                VERBOSITY_DEBUG: DEBUG
            channels:
                - '!event'
                - '!php'
                - '!doctrine'
                - '!deprecation'
