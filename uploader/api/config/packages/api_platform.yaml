api_platform:
    version: '%env(PHRASEA_VERSION)%'
    mapping:
        paths:
            - '%kernel.project_dir%/src/Model'
            - '%kernel.project_dir%/src/Entity'
    formats:
        jsonld:   ['application/ld+json']
        json:     ['application/json']
        html:     ['text/html']
        multipart: ['multipart/form-data']
    patch_formats:
        json: ['application/merge-patch+json']
